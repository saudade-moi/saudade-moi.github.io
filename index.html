<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Italiana&family=Parisienne&display=swap" rel="stylesheet">

<style>

/* =========================================================
   PAGE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 35px 18px;

    overflow-x: hidden;

    text-align: center;
    color: white;

    background:
        url("./fond.png")
        center center / cover
        no-repeat
        fixed;

    background-color: #050205;
}


/* =========================================================
   CADRE PRINCIPAL
   ========================================================= */

.card {

    position: relative;

    width: min(760px, 88vw);

    padding:
        34px
        46px
        31px;

    border-radius: 20px;

    /*
       Fond sombre et légèrement transparent
       comme sur ton image de référence.
    */
    background:

        radial-gradient(
            ellipse at 50% 34%,
            rgba(49, 27, 17, 0.18) 0%,
            rgba(13, 6, 9, 0.76) 48%,
            rgba(5, 2, 5, 0.91) 100%
        );

    /*
       Bordure fine dorée.
    */
    border:
        1px solid
        rgba(255, 193, 76, 0.95);

    /*
       Halo très fin autour du cadre.
       Il ne doit pas devenir une grosse bordure lumineuse.
    */
    box-shadow:

        0 0 2px
        rgba(255, 247, 207, 0.95),

        0 0 6px
        rgba(255, 183, 55, 0.52),

        0 0 15px
        rgba(230, 116, 17, 0.20),

        inset 0 0 11px
        rgba(255, 173, 45, 0.055),

        0 15px 45px
        rgba(0, 0, 0, 0.62);
}


/* =========================================================
   LUMIÈRE DOUCE DES 4 COINS
   ========================================================= */

/*
   Sur la référence les coins sont lumineux,
   mais ce ne sont PAS quatre étoiles identiques.
*/

.corner-glow {

    position: absolute;

    width: 5px;
    height: 5px;

    z-index: 3;

    pointer-events: none;

    border-radius: 50%;

    background:
        rgba(255, 227, 151, 0.70);

    box-shadow:

        0 0 4px 2px
        rgba(255, 235, 176, 0.42),

        0 0 10px 5px
        rgba(255, 172, 47, 0.20),

        0 0 20px 8px
        rgba(222, 102, 15, 0.10);
}

.corner-tl {
    top: 5px;
    left: 6px;
}

.corner-tr {
    top: 5px;
    right: 6px;
}

.corner-bl {
    bottom: 5px;
    left: 6px;
}

.corner-br {
    bottom: 5px;
    right: 6px;
}


/* =========================================================
   4 ÉCLATS PRINCIPAUX
   ========================================================= */

/*
   Référence :
   - milieu en haut
   - milieu en bas
   - milieu à gauche
   - milieu à droite

   Centre presque blanc,
   puis lumière or.
*/

.spark {

    position: absolute;

    z-index: 5;

    width: 3px;
    height: 3px;

    pointer-events: none;

    border-radius: 50%;

    background: #fffdf0;

    box-shadow:

        0 0 2px 1px
        rgba(255, 255, 245, 1),

        0 0 5px 2px
        rgba(255, 235, 159, 0.90),

        0 0 10px 3px
        rgba(255, 180, 53, 0.63),

        0 0 18px 5px
        rgba(230, 117, 18, 0.24);
}


/* trait horizontal très fin */

.spark::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 21px;
    height: 1px;

    transform:
        translate(-50%, -50%);

    background:

        linear-gradient(
            90deg,

            transparent 0%,

            rgba(255, 184, 52, 0.05) 15%,

            rgba(255, 220, 126, 0.40) 35%,

            #fff9d8 47%,

            #ffffff 50%,

            #fff9d8 53%,

            rgba(255, 220, 126, 0.40) 65%,

            rgba(255, 184, 52, 0.05) 85%,

            transparent 100%
        );
}


/* trait vertical très fin */

.spark::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 1px;
    height: 15px;

    transform:
        translate(-50%, -50%);

    background:

        linear-gradient(
            180deg,

            transparent 0%,

            rgba(255, 184, 52, 0.05) 15%,

            rgba(255, 220, 126, 0.40) 35%,

            #fff9d8 47%,

            #ffffff 50%,

            #fff9d8 53%,

            rgba(255, 220, 126, 0.40) 65%,

            rgba(255, 184, 52, 0.05) 85%,

            transparent 100%
        );
}


/* position des 4 éclats */

.spark-top {

    top: -1px;
    left: 50%;

    transform:
        translate(-50%, -50%);
}

.spark-bottom {

    bottom: -1px;
    left: 50%;

    transform:
        translate(-50%, 50%);
}

.spark-left {

    left: -1px;
    top: 50%;

    transform:
        translate(-50%, -50%);
}

.spark-right {

    right: -1px;
    top: 50%;

    transform:
        translate(50%, -50%);
}


/* =========================================================
   TITRE
   ========================================================= */

.title {

    position: relative;
    z-index: 2;

    margin: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    white-space: nowrap;

    line-height: 0.90;
}


/* Saudade + Moi */

.title-word {

    font-family:
        "Italiana",
        Georgia,
        serif;

    font-size: 57px;

    font-weight: 400;

    letter-spacing: -1.7px;

    background:

        linear-gradient(
            90deg,

            #d98a25 0%,

            #f1ae3c 19%,

            #ffd66f 38%,

            #fff2ae 50%,

            #ffd66f 63%,

            #f1ae3c 81%,

            #d98a25 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;
    color: transparent;

    filter:

        drop-shadow(
            0 0 2px
            rgba(255, 190, 72, 0.20)
        );
}


/* grand & manuscrit */

.ampersand {

    display: inline-block;

    margin:
        -8px
        10px
        0
        9px;

    font-family:
        "Parisienne",
        cursive;

    font-size: 79px;

    font-weight: 400;

    line-height: 0.72;

    background:

        linear-gradient(
            180deg,

            #fffde9 0%,

            #fff3b4 35%,

            #f5c35a 68%,

            #dc9028 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;
    color: transparent;

    transform:
        translateY(6px);

    filter:

        drop-shadow(
            0 0 3px
            rgba(255, 210, 103, 0.15)
        );
}


/* =========================================================
   ORNEMENT SOUS LE TITRE
   ========================================================= */

.ornament {

    position: relative;
    z-index: 2;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 14px;

    margin:
        18px
        auto
        13px;
}


/* traits dorés */

.line {

    width: 132px;
    height: 1px;

    background:

        linear-gradient(
            90deg,

            rgba(196, 119, 31, 0.25),

            #df9e32 20%,

            #fff0a2 50%,

            #df9e32 80%,

            rgba(196, 119, 31, 0.25)
        );

    box-shadow:

        0 0 4px
        rgba(255, 181, 54, 0.16);
}


/* =========================================================
   PETIT CŒUR
   ========================================================= */

.heart {

    position: relative;

    width: 34px;
    height: 29px;

    transform:
        rotate(-45deg);

    border-left:
        1.7px solid #f3d873;

    border-bottom:
        1.7px solid #f3d873;

    border-radius:
        2px 0 3px 0;

    filter:

        drop-shadow(
            0 0 2px
            rgba(255, 203, 81, 0.20)
        );
}

.heart::before,
.heart::after {

    content: "";

    position: absolute;

    border:
        1.7px solid #f3d873;

    border-radius: 50%;
}

.heart::before {

    width: 18px;
    height: 24px;

    left: -1.7px;
    top: -13px;

    border-bottom-color:
        transparent;
}

.heart::after {

    width: 24px;
    height: 18px;

    left: 8px;
    top: 6px;

    border-left-color:
        transparent;
}


/* =========================================================
   TEXTES
   ========================================================= */

.subtitle {

    position: relative;
    z-index: 2;

    margin:
        0
        0
        5px;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 23px;

    font-style: italic;
    font-weight: 400;

    line-height: 1.15;

    color: #eed5ec;

    text-shadow:

        0 1px 5px
        rgba(0, 0, 0, 0.90);
}


.description {

    position: relative;
    z-index: 2;

    margin: 0;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 21px;

    font-style: italic;
    font-weight: 400;

    line-height: 1.15;

    color: #ead4e7;

    text-shadow:

        0 1px 5px
        rgba(0, 0, 0, 0.90);
}


/* =========================================================
   SPOTIFY
   ========================================================= */

.music-player {

    position: relative;
    z-index: 2;

    width: 100%;

    margin:
        20px
        auto
        0;
}


.music-player iframe {

    display: block;

    width: 100%;

    height: 152px;

    border: 0;

    border-radius: 12px;

    box-shadow:

        0 8px 25px
        rgba(0, 0, 0, 0.55);
}


/* =========================================================
   TABLETTES / PETITS ORDINATEURS
   ========================================================= */

@media (max-width: 850px) {

    body {

        background-attachment:
            scroll;
    }

    .card {

        width: min(680px, 91vw);

        padding:
            31px
            38px
            28px;
    }

    .title-word {

        font-size: 52px;
    }

    .ampersand {

        font-size: 73px;
    }

    .line {

        width: 115px;
    }
}


/* =========================================================
   TÉLÉPHONE
   ========================================================= */

@media (max-width: 600px) {

    body {

        padding:
            18px
            10px;

        background-position:
            center center;
    }

    .card {

        width: 92vw;

        padding:
            27px
            20px
            22px;

        border-radius:
            18px;
    }

    .title-word {

        font-size:
            clamp(34px, 10.2vw, 45px);

        letter-spacing:
            -1px;
    }

    .ampersand {

        margin:
            -5px
            6px
            0;

        font-size:
            clamp(52px, 14vw, 65px);

        transform:
            translateY(5px);
    }

    .ornament {

        gap: 11px;

        margin:
            17px
            auto
            12px;
    }

    .line {

        width:
            clamp(64px, 21vw, 95px);
    }

    .heart {

        transform:
            rotate(-45deg)
            scale(0.84);

        margin:
            -2px
            -3px;
    }

    .subtitle {

        font-size:
            19px;
    }

    .description {

        font-size:
            18px;

        line-height:
            1.17;
    }

    .music-player {

        margin-top:
            17px;
    }

    .music-player iframe {

        height:
            152px;

        border-radius:
            11px;
    }
}


/* =========================================================
   TRÈS PETIT TÉLÉPHONE
   ========================================================= */

@media (max-width: 380px) {

    .card {

        width:
            94vw;

        padding-left:
            15px;

        padding-right:
            15px;
    }

    .title-word {

        font-size:
            33px;
    }

    .ampersand {

        font-size:
            49px;

        margin-left:
            4px;

        margin-right:
            4px;
    }

    .line {

        width:
            58px;
    }

    .subtitle {

        font-size:
            18px;
    }

    .description {

        font-size:
            17px;
    }
}

</style>

</head>


<body>


<div class="card">


    <!-- Lumière douce dans les quatre coins -->

    <span class="corner-glow corner-tl"></span>
    <span class="corner-glow corner-tr"></span>
    <span class="corner-glow corner-bl"></span>
    <span class="corner-glow corner-br"></span>


    <!--
        Les quatre véritables éclats lumineux
        visibles sur ton image de référence
    -->

    <span class="spark spark-top"></span>
    <span class="spark spark-bottom"></span>
    <span class="spark spark-left"></span>
    <span class="spark spark-right"></span>


    <!-- TITRE -->

    <h1 class="title">

        <span class="title-word">
            Saudade
        </span>

        <span class="ampersand">
            &amp;
        </span>

        <span class="title-word">
            Moi
        </span>

    </h1>


    <!-- CŒUR + TRAITS -->

    <div class="ornament">

        <span class="line"></span>

        <span class="heart"></span>

        <span class="line"></span>

    </div>


    <!-- TEXTES -->

    <p class="subtitle">
        Un peu de moi, un peu de nous…
    </p>

    <p class="description">
        Où chaque souvenir se prolonge en musique
    </p>


    <!-- SPOTIFY -->

    <div class="music-player">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy">

        </iframe>

    </div>


</div>


</body>

</html>
