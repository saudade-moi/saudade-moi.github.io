<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    background: #030104;
}


/* =====================================================
   TON IMAGE VALIDÉE
   ===================================================== */

.page {
    position: relative;

    /*
       Même modèle sur ordinateur et téléphone.
       Aucune modification de couleur.
    */

    width: min(100vw, 150vh);

    aspect-ratio: 3 / 2;

    flex-shrink: 0;

    background-image:
        url("./saudade-base-sans-spotify-propre.png");

    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}


/* =====================================================
   VRAI SPOTIFY
   ===================================================== */

.spotify {
    position: absolute;

    /*
       Placement dans l'espace que nous avons nettoyé.
    */

    left: 21.5%;
    top: 55.5%;

    width: 57%;
    height: 19%;

    z-index: 10;

    overflow: hidden;

    border-radius: 14px;

    background: #000;

    box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.50);
}


.spotify iframe {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    border-radius: 14px;

    background: #000;
}


/* =====================================================
   TÉLÉPHONE
   ===================================================== */

@media (max-width: 650px) {

    body {
        min-height: 100svh;

        background: #030104;

        overflow: hidden;
    }

    .page {

        /*
           EXACTEMENT la même image.
           Pas de filtre fuchsia/violet.
           Les couleurs restent identiques.
        */

        width: 100vw;

        aspect-ratio: 3 / 2;

        filter: none;
    }

    .spotify {

        /*
           Même emplacement proportionnel que
           sur ordinateur.
        */

        left: 21.5%;
        top: 55.5%;

        width: 57%;
        height: 19%;

        border-radius: 8px;
    }

    .spotify iframe {
        border-radius: 8px;
    }

}

</style>

</head>


<body>


<div class="page">


    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy">

        </iframe>

    </div>


</div>


</body>

</html>
