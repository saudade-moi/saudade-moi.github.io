<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<style>

/* ---------- PAGE ---------- */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 55px 20px;

    overflow-x: hidden;

    font-family: Georgia, "Times New Roman", serif;
    text-align: center;

    color: #eee6ef;

    position: relative;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(104, 35, 120, 0.30),
            transparent 32%
        ),

        radial-gradient(
            circle at 85% 75%,
            rgba(72, 24, 91, 0.30),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #030203 0%,
            #100812 48%,
            #050305 100%
        );
}


/* ---------- POUSSIÈRE D’OR ---------- */

body::after {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 0;

    opacity: 0.72;

    background-image:

        radial-gradient(
            circle,
            rgba(255, 214, 121, 0.90) 0 0.7px,
            transparent 1.3px
        ),

        radial-gradient(
            circle,
            rgba(255, 190, 70, 0.65) 0 0.55px,
            transparent 1.15px
        ),

        radial-gradient(
            circle,
            rgba(255, 232, 174, 0.75) 0 0.45px,
            transparent 1px
        );

    background-size:
        37px 37px,
        59px 59px,
        83px 83px;

    background-position:
        5px 11px,
        21px 7px,
        13px 31px;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.88),
            rgba(0,0,0,0.58) 40%,
            rgba(0,0,0,0.82)
        );

    mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.88),
            rgba(0,0,0,0.58) 40%,
            rgba(0,0,0,0.82)
        );
}


/* ---------- CARTE ---------- */

.card {
    position: relative;
    z-index: 1;

    width: min(630px, 94vw);

    padding: 68px 38px 48px;

    border-radius: 42px;

    border: 1px solid rgba(221, 171, 70, 0.82);

    background:
        linear-gradient(
            145deg,
            rgba(12, 7, 13, 0.97) 0%,
            rgba(29, 13, 34, 0.92) 50%,
            rgba(7, 4, 8, 0.97) 100%
        );

    box-shadow:
        0 0 6px rgba(227, 176, 75, 0.52),
        0 0 18px rgba(196, 135, 40, 0.18),
        inset 0 0 35px rgba(80, 30, 88, 0.18);
}


/* ---------- TITRE ---------- */

h1 {
    margin: 0;

    font-size: clamp(45px, 8vw, 64px);

    font-weight: 400;

    letter-spacing: 2px;

    line-height: 1.1;

    color: #e7b64f;

    text-shadow:
        0 0 8px rgba(225, 171, 67, 0.16);
}


/* ---------- CŒUR + TRAITS ---------- */

.ornament {
    margin: 33px auto 40px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 18px;
}

.line {
    width: 115px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(232, 184, 82, 0.95)
        );
}

.line.right {
    background:
        linear-gradient(
            90deg,
            rgba(232, 184, 82, 0.95),
            transparent
        );
}

.heart {
    font-size: 47px;

    font-weight: 300;

    line-height: 1;

    color: #efc760;
}


/* ---------- PREMIER TEXTE ---------- */

.subtitle {
    margin: 0 0 27px;

    font-size: 29px;

    line-height: 1.4;

    font-style: italic;
    font-weight: 600;

    color: #d9bfd9;
}


/* ---------- DEUXIÈME TEXTE ---------- */

.description {
    margin: 0 auto 48px;

    max-width: 520px;

    font-size: 29px;

    line-height: 1.45;

    color: #eee5ef;
}


/* ---------- SPOTIFY ---------- */

.spotify-container {
    width: 100%;

    margin: 0 auto;

    overflow: hidden;

    border-radius: 22px;

    border: 1px solid rgba(216, 163, 65, 0.65);
}

.spotify-container iframe {
    display: block;

    width: 100%;
    height: 270px;

    border: 0;
}


/* ---------- TÉLÉPHONE ---------- */

@media (max-width: 600px) {

    body {
        align-items: flex-start;

        padding:
            60px
            16px
            65px;
    }

    .card {
        width: 100%;

        padding:
            58px
            25px
            43px;

        border-radius: 38px;
    }

    h1 {
        font-size: 44px;
    }

    .ornament {
        margin:
            31px auto
            39px;

        gap: 14px;
    }

    .line {
        width: 78px;
    }

    .heart {
        font-size: 42px;
    }

    .subtitle {
        font-size: 24px;
    }

    .description {
        font-size: 24px;

        margin-bottom: 43px;
    }
}

</style>
</head>


<body>

<main class="card">

    <h1>Saudade &amp; Moi</h1>

    <div class="ornament">

        <span class="line"></span>

        <span class="heart">♡</span>

        <span class="line right"></span>

    </div>

    <p class="subtitle">
        Un peu de moi, un peu de nous...
    </p>

    <p class="description">
        Où chaque souvenir se prolonge en musique
    </p>

    <div class="spotify-container">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>

    </div>

</main>

</body>
</html>
