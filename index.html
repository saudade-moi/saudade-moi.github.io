<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080509;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* ==================================================
   CONTENEUR DE RÉFÉRENCE
   ================================================== */

.scene {

    position: relative;

    aspect-ratio: 3 / 2;

    width: min(92vw, 1320px);

    max-height: 88vh;
    max-height: 88svh;
}


@media (min-width: 651px) {

    .scene {

        width: min(
            92vw,
            1320px,
            calc(88svh * 1.5)
        );

    }

}


/* ==================================================
   IMAGE
   ================================================== */

.decor {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
}


/* ==================================================
   SPOTIFY ORDINATEUR
   INCHANGÉ
   ================================================== */

.spotify {

    position: absolute;

    left: 25.85%;

    width: 48.37%;

    top: 55.27%;

    height: 14.84%;

    min-height: 0;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 24px rgba(0,0,0,0.35);
}


.spotify iframe {

    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    border-radius: inherit;
}


/* ==================================================
   VERSION TÉLÉPHONE
   ================================================== */

@media (max-width: 650px) {

    body {

        overflow: hidden;

        background: #080509;

    }


    /*
       DÉCOR TÉLÉPHONE INCHANGÉ
    */

    .scene {

        flex: 0 0 auto;

        width: 142vw;

        max-width: none;
        max-height: none;

        aspect-ratio: 3 / 2;

    }


    /*
       SPOTIFY TÉLÉPHONE

       C'est la SEULE partie que l'on ajuste.

       Le lecteur est légèrement moins large
       pour rester à l'intérieur du cadre.

       Sa hauteur reste suffisante pour que
       Spotify affiche correctement ses textes
       et ses commandes.
    */

    .spotify {

        left: 29%;

        width: 42%;

        top: 56%;

        height: 152px;

        min-height: 152px;

        border-radius: 12px;

        overflow: hidden;

    }


    .spotify iframe {

        display: block;

        width: 100%;

        height: 152px;

        border: 0;

        border-radius: 12px;

    }

}


/* ==================================================
   PETITS TÉLÉPHONES
   ================================================== */

@media (max-width: 380px) {

    .scene {

        width: 148vw;

    }


    /*
       On garde le même principe Spotify.
    */

    .spotify {

        left: 29%;

        width: 42%;

        top: 56%;

        height: 152px;

        min-height: 152px;

    }

}

</style>

</head>


<body>


<div class="scene">


    <!-- IMAGE DE FOND -->

    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt=""
    >


    <!-- VRAI LIEN SPOTIFY -->

    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy"

            title="Flamme - Radio Edit - Slaï">

        </iframe>

    </div>


</div>


</body>

</html>
