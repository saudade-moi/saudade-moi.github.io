<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

html {
    background: #070408;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    background: #070408;

    overflow-x: hidden;
}


/* ==================================================
   PAGE
   ================================================== */

.page {

    position: relative;

    width: 100%;

    min-height: 100vh;
    min-height: 100svh;

    display: flex;

    justify-content: center;
    align-items: center;

    /*
       IMAGE VALIDÉE SANS SPOTIFY
    */

    background-image:
        url("./saudade-sans-spotify.png");

    background-repeat: no-repeat;

    background-position: center center;

    background-size: cover;

}


/* ==================================================
   ZONE SPOTIFY
   ================================================== */

.spotify {

    /*
       Position correspondant à l'emplacement
       du lecteur dans ton modèle validé.
    */

    position: absolute;

    left: 50%;

    top: 63.5%;

    transform: translate(-50%, -50%);

    width: min(805px, 52.5vw);

    height: 152px;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.38);

}


.spotify iframe {

    display: block;

    width: 100%;

    height: 152px;

    border: 0;

    border-radius: 14px;

    background: #121212;

}


/* ==================================================
   ÉCRANS D'ORDINATEUR PLUS PETITS
   ================================================== */

@media
(max-width: 1200px)
and (min-width: 651px) {

    .spotify {

        width: 55vw;

        top: 63.5%;

    }

}


/* ==================================================
   TÉLÉPHONE
   ================================================== */

@media (max-width: 650px) {

    body {

        min-height: 100svh;

    }


    .page {

        /*
           Même décor et mêmes couleurs.

           Sur téléphone on ne force surtout plus
           l'image horizontale entière à rentrer
           dans la largeur.

           COVER remplit l'écran :
           donc plus d'énormes bandes noires
           au-dessus et en dessous.
        */

        min-height: 100svh;

        background-size: cover;

        background-position: center center;

    }


    .spotify {

        /*
           Le lecteur reste lisible sur téléphone.
        */

        position: absolute;

        left: 50%;

        top: 65%;

        transform: translate(-50%, -50%);

        width: 82vw;

        max-width: 430px;

        height: 152px;

        border-radius: 12px;

    }


    .spotify iframe {

        width: 100%;

        height: 152px;

        border-radius: 12px;

    }

}


/* ==================================================
   PETITS TÉLÉPHONES
   ================================================== */

@media (max-width: 380px) {

    .spotify {

        width: 86vw;

        top: 65%;

    }

}

</style>
</head>


<body>


<main class="page">


    <!--
        SEUL ET UNIQUE LECTEUR SPOTIFY
        FLAMME - RADIO EDIT / SLAÏ
    -->

    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy"

            title="Flamme - Radio Edit - Slaï">

        </iframe>

    </div>


</main>


</body>

</html>
