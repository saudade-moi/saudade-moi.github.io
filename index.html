<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<!-- POLICES -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Italiana&family=Parisienne&display=swap" rel="stylesheet">

<style>

/* ==========================================================
   PAGE
   ========================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;

    padding: 4vh 20px;

    text-align: center;

    color: white;

    background:
        url("./fond.png")
        center center / cover
        no-repeat fixed;

    background-color: #050205;
}


/* ==========================================================
   CADRE PRINCIPAL
   ========================================================== */

.card {

    position: relative;

    width: min(62vw, 955px);

    min-width: 760px;

    padding:
        clamp(30px, 3.4vh, 44px)
        clamp(45px, 4vw, 62px)
        clamp(30px, 3.6vh, 42px);

    border-radius: 30px;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(30, 17, 10, 0.28) 0%,
            rgba(9, 4, 6, 0.91) 72%
        );

    border: 1px solid rgba(255, 199, 83, 0.95);

    box-shadow:

        0 0 3px rgba(255, 236, 175, 0.95),

        0 0 10px rgba(255, 180, 47, 0.62),

        0 0 25px rgba(255, 145, 28, 0.24),

        inset 0 0 24px rgba(255, 167, 37, 0.07),

        0 20px 55px rgba(0, 0, 0, 0.72);
}


/* éclat haut */

.card::before {

    content: "";

    position: absolute;

    top: -2px;
    left: 50%;

    transform: translateX(-50%);

    width: 72px;
    height: 3px;

    border-radius: 50%;

    background: #fff1ba;

    box-shadow:
        0 0 7px #fff4c7,
        0 0 15px #ffc755,
        0 0 27px #ff9c20;
}


/* éclat bas */

.card::after {

    content: "";

    position: absolute;

    bottom: -2px;
    left: 50%;

    transform: translateX(-50%);

    width: 62px;
    height: 3px;

    border-radius: 50%;

    background: #ffe9a1;

    box-shadow:
        0 0 7px #fff1b5,
        0 0 15px #ffbd45,
        0 0 27px #ff921b;
}


/* ==========================================================
   TITRE
   ========================================================== */

.title {

    margin: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    white-space: nowrap;

    line-height: 0.95;
}


/* Saudade + Moi */

.title-word {

    font-family: "Italiana", Georgia, serif;

    font-size: clamp(60px, 5.25vw, 81px);

    font-weight: 400;

    letter-spacing: -2px;

    background:
        linear-gradient(
            90deg,
            #e8a036 0%,
            #ffc35b 22%,
            #fff6c7 50%,
            #ffd776 72%,
            #e69a32 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    color: transparent;

    filter:
        drop-shadow(0 0 3px rgba(255, 185, 60, 0.12));
}


/* & CALLIGRAPHIÉ */

.ampersand {

    display: inline-block;

    margin:
        -7px
        12px
        0
        9px;

    font-family: "Parisienne", cursive;

    font-size: clamp(88px, 7vw, 108px);

    font-weight: 400;

    line-height: 0.75;

    background:
        linear-gradient(
            180deg,
            #fffbe2 0%,
            #fff2b0 42%,
            #efb446 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    color: transparent;

    transform: translateY(7px);
}


/* ==========================================================
   TRAITS + COEUR
   ========================================================== */

.ornament {

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 20px;

    margin: 24px auto 16px;
}


.line {

    width: 188px;
    height: 1.5px;

    background:
        linear-gradient(
            90deg,
            #d99a31,
            #fff1a3,
            #d99a31
        );

    box-shadow:
        0 0 5px rgba(255, 185, 54, 0.24);
}


.heart {

    position: relative;

    width: 49px;
    height: 37px;

    transform: rotate(-45deg);

    border-left: 3px solid #f5d86e;
    border-bottom: 3px solid #f5d86e;

    border-radius: 2px 0 4px 0;
}


.heart::before,
.heart::after {

    content: "";

    position: absolute;

    border: 3px solid #f5d86e;

    border-radius: 50%;
}


.heart::before {

    width: 25px;
    height: 34px;

    left: -3px;
    top: -19px;

    border-bottom-color: transparent;
}


.heart::after {

    width: 34px;
    height: 25px;

    left: 11px;
    top: 8px;

    border-left-color: transparent;
}


/* ==========================================================
   TEXTES
   ========================================================== */

.subtitle {

    margin: 0 0 7px;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: clamp(27px, 2.25vw, 35px);

    font-style: italic;
    font-weight: 400;

    line-height: 1.12;

    color: #edcfeb;

    text-shadow:
        0 1px 4px rgba(0, 0, 0, 0.8);
}


.description {

    margin: 0;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: clamp(26px, 2.15vw, 33px);

    font-style: italic;
    font-weight: 400;

    line-height: 1.15;

    color: #f0d9ee;

    text-shadow:
        0 1px 4px rgba(0, 0, 0, 0.8);
}


/* ==========================================================
   SPOTIFY
   ========================================================== */

.music-player {

    width: 100%;

    margin: 28px auto 0;
}


.music-player iframe {

    display: block;

    width: 100%;

    height: 152px;

    border: 0;

    border-radius: 18px;

    box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.50);
}


/* ==========================================================
   ÉCRANS INTERMÉDIAIRES
   ========================================================== */

@media (max-width: 1100px) {

    .card {

        width: 78vw;
        min-width: 0;

        padding:
            38px
            45px
            34px;
    }

    .title-word {

        font-size: 64px;
    }

    .ampersand {

        font-size: 90px;
    }

    .subtitle {

        font-size: 28px;
    }

    .description {

        font-size: 27px;
    }
}


/* ==========================================================
   TÉLÉPHONE
   ========================================================== */

@media (max-width: 600px) {

    body {

        padding: 18px 10px;

        background-attachment: scroll;

        background-position: center center;
    }


    .card {

        width: 92vw;

        min-width: 0;
        max-width: 390px;

        padding:
            29px
            17px
            22px;

        border-radius: 22px;
    }


    .title-word {

        font-size: 37px;

        letter-spacing: -1px;
    }


    .ampersand {

        margin:
            -3px
            5px
            0;

        font-size: 55px;

        transform: translateY(4px);
    }


    .ornament {

        gap: 11px;

        margin:
            18px
            auto
            15px;
    }


    .line {

        width: 74px;
    }


    .heart {

        transform:
            rotate(-45deg)
            scale(0.70);

        margin:
            -5px
            -5px;
    }


    .subtitle {

        margin-bottom: 7px;

        font-size: 20px;
    }


    .description {

        font-size: 19px;

        line-height: 1.22;
    }


    .music-player {

        margin-top: 21px;
    }


    .music-player iframe {

        height: 152px;

        border-radius: 14px;
    }
}


/* ==========================================================
   PETITS TÉLÉPHONES
   ========================================================== */

@media (max-width: 360px) {

    .title-word {

        font-size: 33px;
    }


    .ampersand {

        font-size: 49px;
    }


    .line {

        width: 59px;
    }


    .subtitle {

        font-size: 18px;
    }


    .description {

        font-size: 17px;
    }
}

</style>

</head>


<body>


<div class="card">


    <!-- TITRE -->

    <h1 class="title">

        <span class="title-word">
            Saudade
        </span>

        <span class="ampersand">
            &amp;
        </span>

        <span class="title-word">
            Moi
        </span>

    </h1>


    <!-- COEUR + TRAITS -->

    <div class="ornament">

        <span class="line"></span>

        <span class="heart"></span>

        <span class="line"></span>

    </div>


    <!-- TEXTE -->

    <p class="subtitle">
        Un peu de moi, un peu de nous…
    </p>


    <p class="description">
        Où chaque souvenir se prolonge en musique
    </p>


    <!-- VRAI LECTEUR SPOTIFY -->

    <div class="music-player">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>

    </div>


</div>


</body>

</html>
