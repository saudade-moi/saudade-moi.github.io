<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Saudade & Moi</title>

<style>

/* ==================================================
   BASE
   ================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #080509;

    overflow: hidden;
}


/* ==================================================
   PAGE
   ================================================== */

.page {

    position: fixed;

    inset: 0;

    width: 100vw;

    height: 100vh;
    height: 100svh;

    overflow: hidden;

    background: #080509;
}


/* ==================================================
   ORDINATEUR
   NE PAS MODIFIER
   ================================================== */

.decor {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: auto;

    height: 86vh;
    height: 86svh;

    max-width: 92vw;

    object-fit: contain;

    display: block;
}


.spotify {

    position: absolute;

    left: 50%;
    top: 63%;

    transform: translate(-50%, -50%);

    width: 380px;

    max-width: 32vw;

    height: 152px;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 22px rgba(0,0,0,0.35);
}


.spotify iframe {

    display: block;

    width: 100%;
    height: 152px;

    border: 0;

    border-radius: 14px;
}


/* ==================================================
   TÉLÉPHONE UNIQUEMENT
   ================================================== */

@media screen and (max-width: 650px) {

    .page {

        width: 100vw;

        height: 100vh;
        height: 100svh;

        overflow: hidden;

        background: #080509;
    }


    /*
       CADRE / DÉCOR

       On conserve 130vw pour ne pas rendre
       les deux phrases trop petites.
    */

    .decor {

        position: absolute;

        left: 50%;
        top: 43%;

        transform: translate(-50%, -50%);

        width: 130vw;

        height: auto;

        max-width: none;

        object-fit: contain;
    }


    /*
       SPOTIFY TÉLÉPHONE

       Réduit de 300px à 230px.
       Il doit maintenant rester
       à l'intérieur du cadre doré.
    */

    .spotify {

        position: absolute;

        left: 50%;

        top: 55.5%;

        transform: translate(-50%, -50%);

        width: 230px;

        max-width: 62vw;

        height: 152px;

        overflow: hidden;

        border-radius: 12px;

        background: #121212;

        box-shadow:
            0 6px 18px rgba(0,0,0,0.35);
    }


    .spotify iframe {

        display: block;

        width: 100%;

        height: 152px;

        border: 0;

        border-radius: 12px;
    }

}


/* ==================================================
   PETITS TÉLÉPHONES
   ================================================== */

@media screen and (max-width: 380px) {

    .decor {

        width: 135vw;

        top: 43%;
    }


    .spotify {

        width: 215px;

        max-width: 60vw;

        top: 55.5%;
    }

}

</style>

</head>


<body>


<div class="page">


    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt=""
    >


    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy"

            title="Flamme - Radio Edit - Slaï">

        </iframe>

    </div>


</div>


</body>

</html>
