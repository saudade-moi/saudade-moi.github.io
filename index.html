<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    background: #050207;
}


/* =====================================================
   IMAGE DE RÉFÉRENCE
   ===================================================== */

.page {
    position: relative;

    /*
       Sur ordinateur :
       on conserve beaucoup de décor visible autour.
    */

    width: min(1180px, 88vw);

    aspect-ratio: 3 / 2;

    flex-shrink: 0;

    background-image:
        url("./reference-saudade-v2.png");

    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}


/* =====================================================
   SPOTIFY
   ===================================================== */

.spotify {
    position: absolute;

    /*
       Lecteur centré et légèrement plus étroit
       pour rester élégant dans le cadre.
    */

    left: 27%;
    top: 55%;

    width: 46%;
    height: 16%;

    z-index: 10;

    background: #000;

    border-radius: 13px;

    overflow: hidden;

    box-shadow:
        0 9px 28px rgba(0,0,0,.55);
}

.spotify iframe {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    border-radius: 13px;

    background: #000;
}


/* =====================================================
   ORDINATEUR AVEC ÉCRAN PEU HAUT
   ===================================================== */

@media (min-width: 651px) and (max-height: 750px) {

    .page {
        width: min(1050px, 84vw, 142vh);
    }

}


/* =====================================================
   VERSION TÉLÉPHONE
   ===================================================== */

@media (max-width: 650px) {

    body {
        min-height: 100svh;

        overflow: hidden;

        /*
           Fond noir-violet autour de l'image.
        */

        background:
            radial-gradient(
                ellipse at center,
                #16091f 0%,
                #09030e 58%,
                #030104 100%
            );
    }


    .page {

        /*
           On ne remplit volontairement PAS tout l'écran.
           Cela laisse davantage de décor visible.
        */

        width: 94vw;

        aspect-ratio: 3 / 2;

        background-image:
            url("./reference-saudade-v2.png");

        background-size: 100% 100%;
        background-position: center;

        /*
           On pousse légèrement les tons vers
           le violet plutôt que le fuchsia.
        */

        filter:
            hue-rotate(12deg)
            saturate(.90);
    }


    /*
       Le lecteur reste noir.
       On annule la modification de couleur
       appliquée à l'image pour que Spotify
       conserve ses vraies couleurs.
    */

    .spotify {

        left: 23%;

        top: 54%;

        width: 54%;

        height: 18%;

        background: #000;

        filter:
            hue-rotate(-12deg)
            saturate(1.11);

        border-radius: 10px;
    }


    .spotify iframe {
        border-radius: 10px;
        background: #000;
    }

}


/* =====================================================
   PETITS TÉLÉPHONES
   ===================================================== */

@media (max-width: 400px) {

    .page {
        width: 96vw;
    }

    .spotify {
        left: 22%;
        width: 56%;
    }

}

</style>

</head>


<body>


<div class="page">


    <div class="spotify">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>

    </div>


</div>


</body>

</html>
