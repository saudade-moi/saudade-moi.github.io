<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080509;
}

body {
    overflow: hidden;
}


/* =========================================
   PAGE
   ========================================= */

.page {

    position: relative;

    width: 100vw;

    height: 100vh;
    height: 100svh;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #241020 0%,
            #120911 52%,
            #080509 100%
        );

}


/* =========================================
   IMAGE
   ========================================= */

.decor {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: auto;

    /*
       IMPORTANT :
       l'image est maintenant limitée
       par la HAUTEUR de l'écran.

       Cela empêche le cadre gigantesque
       que tu avais sur ordinateur.
    */

    height: 88vh;
    height: 88svh;

    max-width: 94vw;

    object-fit: contain;

    display: block;

}


/* =========================================
   SPOTIFY ORDINATEUR
   ========================================= */

.spotify {

    position: absolute;

    left: 50%;

    /*
       Position dans le cadre
    */

    top: 64%;

    transform: translate(-50%, -50%);

    /*
       Taille réduite en même temps
       que le nouveau cadre
    */

    width: min(610px, 44vw);

    height: 152px;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35);

}


.spotify iframe {

    display: block;

    width: 100%;

    height: 152px;

    border: 0;

    border-radius: 14px;

}


/* =========================================
   ÉCRANS D'ORDINATEUR PEU HAUTS
   comme celui de ta capture
   ========================================= */

@media (min-width: 651px) and (max-height: 700px) {

    .decor {

        height: 86svh;

    }

    .spotify {

        width: min(580px, 43vw);

        top: 64%;

    }

}


/* =========================================
   TÉLÉPHONE
   ========================================= */

@media (max-width: 650px) {

    .page {

        width: 100vw;

        height: 100svh;

        background:
            radial-gradient(
                ellipse at center,
                #291126 0%,
                #140a13 55%,
                #080509 100%
            );

    }


    /*
       Sur téléphone on ne fait PLUS
       "cover".

       On agrandit uniquement assez
       pour que le texte reste lisible,
       sans avoir le cadre énorme.
    */

    .decor {

        width: 145vw;

        height: auto;

        max-width: none;

        left: 50%;

        top: 45%;

        transform: translate(-50%, -50%);

    }


    .spotify {

        left: 50%;

        top: 58%;

        transform: translate(-50%, -50%);

        width: 76vw;

        max-width: 340px;

        height: 152px;

        border-radius: 12px;

    }


    .spotify iframe {

        width: 100%;

        height: 152px;

        border-radius: 12px;

    }

}


/* =========================================
   PETITS TÉLÉPHONES
   ========================================= */

@media (max-width: 380px) {

    .decor {

        width: 150vw;

        top: 45%;

    }

    .spotify {

        width: 80vw;

        max-width: 310px;

        top: 58%;

    }

}

</style>

</head>


<body>

<main class="page">


    <!-- TON IMAGE VALIDÉE -->

    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt=""
    >


    <!-- VRAI SPOTIFY : FLAMME - SLAÏ -->

    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy"

            title="Flamme - Radio Edit - Slaï">

        </iframe>

    </div>


</main>

</body>

</html>
