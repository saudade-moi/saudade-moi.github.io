<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<style>

/* ==================================================
   PAGE
   ================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding: 60px 20px 80px;

    overflow-x: hidden;

    font-family: Georgia, "Times New Roman", serif;
    text-align: center;

    color: #eee5ef;

    position: relative;

    background:
        radial-gradient(
            ellipse at 18% 18%,
            rgba(100, 25, 105, 0.20) 0%,
            rgba(55, 10, 65, 0.10) 28%,
            transparent 55%
        ),

        radial-gradient(
            ellipse at 82% 72%,
            rgba(75, 18, 90, 0.17) 0%,
            transparent 52%
        ),

        radial-gradient(
            ellipse at 50% 45%,
            rgba(40, 8, 45, 0.12) 0%,
            transparent 58%
        ),

        linear-gradient(
            145deg,
            #080509 0%,
            #120713 38%,
            #170817 65%,
            #070507 100%
        );

    background-attachment: fixed;
}


/* ==================================================
   HALO VIOLET TRÈS DISCRET
   ================================================== */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 15% 28%,
            rgba(130, 42, 135, 0.10),
            transparent 24%
        ),

        radial-gradient(
            circle at 85% 63%,
            rgba(105, 28, 120, 0.10),
            transparent 28%
        );

    filter: blur(20px);

    z-index: 0;
}


/* ==================================================
   POUSSIÈRE D’OR
   fine + irrégulière + diffuse
   ================================================== */

.gold-dust {
    position: fixed;
    inset: 0;

    pointer-events: none;
    overflow: hidden;

    z-index: 1;
}

.gold-dust span {
    position: absolute;

    width: var(--size);
    height: var(--size);

    left: var(--x);
    top: var(--y);

    border-radius: 50%;

    background: rgba(229, 181, 86, var(--opacity));

    box-shadow:
        0 0 3px rgba(229, 181, 86, 0.40),
        0 0 7px rgba(229, 181, 86, 0.18);

    filter: blur(var(--blur));

    animation:
        shimmer var(--duration) ease-in-out infinite alternate;
}


@keyframes shimmer {

    0% {
        opacity: 0.35;
        transform: scale(0.85);
    }

    100% {
        opacity: 1;
        transform: scale(1.15);
    }

}


/* ==================================================
   CARTE PRINCIPALE
   ================================================== */

.card {
    position: relative;

    z-index: 2;

    width: min(630px, 94vw);

    padding: 72px 38px 52px;

    border-radius: 42px;

    border: 1px solid rgba(224, 174, 73, 0.82);

    background:
        linear-gradient(
            150deg,
            rgba(37, 8, 37, 0.78),
            rgba(17, 5, 19, 0.88)
        );

    box-shadow:
        0 0 5px rgba(232, 182, 76, 0.60),
        0 0 18px rgba(211, 151, 49, 0.28),
        0 0 45px rgba(122, 40, 120, 0.13),
        inset 0 0 35px rgba(82, 20, 78, 0.14);

    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
}


/* léger reflet intérieur */

.card::before {
    content: "";

    position: absolute;

    inset: 1px;

    border-radius: 40px;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 15%,
            rgba(110, 35, 110, 0.08),
            transparent 42%
        );
}


/* ==================================================
   TITRE
   ================================================== */

h1 {
    position: relative;

    margin: 0;

    font-size: clamp(48px, 8vw, 67px);

    font-weight: 400;

    letter-spacing: 3px;

    line-height: 1.1;

    background:
        linear-gradient(
            180deg,
            #f6d98e 0%,
            #e8b653 48%,
            #c98b2e 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    text-shadow:
        0 0 10px rgba(218, 157, 55, 0.10);
}


/* ==================================================
   ORNEMENT CŒUR
   ================================================== */

.ornament {
    margin: 35px auto 43px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 20px;

    color: #e8b852;
}


.line {
    width: 120px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(232, 184, 82, 0.95)
        );
}


.line.right {
    background:
        linear-gradient(
            90deg,
            rgba(232, 184, 82, 0.95),
            transparent
        );
}


.heart {
    font-family: Georgia, serif;

    font-size: 49px;
    font-weight: 300;

    line-height: 1;

    color: #efc760;

    transform: translateY(-2px);
}


/* ==================================================
   TEXTES
   ================================================== */

.subtitle {
    margin: 0 0 28px;

    font-size: 31px;

    font-style: italic;
    font-weight: 600;

    color: #d8bdd7;

    line-height: 1.35;

    text-shadow:
        0 0 12px rgba(153, 80, 148, 0.15);
}


.description {
    margin: 0 auto 52px;

    max-width: 520px;

    font-size: 31px;

    font-weight: 400;

    line-height: 1.45;

    color: #eee4ef;
}


/* ==================================================
   SPOTIFY
   ================================================== */

.spotify-container {
    position: relative;

    width: 100%;

    margin: 0 auto;

    border-radius: 23px;

    overflow: hidden;

    border: 1px solid rgba(220, 165, 64, 0.70);

    box-shadow:
        0 0 10px rgba(218, 161, 58, 0.12);
}


.spotify-container iframe {
    display: block;

    width: 100%;
    height: 270px;

    border: 0;
}


/* ==================================================
   MOBILE
   ================================================== */

@media (max-width: 600px) {

    body {
        padding: 60px 16px 70px;
    }

    .card {
        width: 100%;

        padding:
            62px
            27px
            47px;

        border-radius: 38px;
    }

    h1 {
        font-size: 45px;

        letter-spacing: 2px;
    }

    .ornament {
        margin:
            32px auto
            42px;

        gap: 15px;
    }

    .line {
        width: 82px;
    }

    .heart {
        font-size: 43px;
    }

    .subtitle {
        font-size: 25px;

        margin-bottom: 26px;
    }

    .description {
        font-size: 25px;

        margin-bottom: 46px;
    }

    .spotify-container iframe {
        height: 270px;
    }

}


/* petits téléphones */

@media (max-width: 390px) {

    .card {
        padding-left: 20px;
        padding-right: 20px;
    }

    h1 {
        font-size: 39px;
    }

    .line {
        width: 65px;
    }

    .subtitle {
        font-size: 22px;
    }

    .description {
        font-size: 23px;
    }

}

</style>
</head>


<body>


<!-- POUSSIÈRE D’OR -->

<div class="gold-dust" id="goldDust"></div>


<!-- CARTE -->

<main class="card">

    <h1>Saudade &amp; Moi</h1>


    <div class="ornament">

        <span class="line"></span>

        <span class="heart">♡</span>

        <span class="line right"></span>

    </div>


    <p class="subtitle">
        Un peu de moi, un peu de nous...
    </p>


    <p class="description">
        Où chaque souvenir se prolonge en musique
    </p>


    <div class="spotify-container">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>

    </div>

</main>


<script>

/*
   Création de la poussière d’or.

   Les particules sont volontairement :
   - irrégulières
   - de tailles différentes
   - plus ou moins visibles
   - réparties aléatoirement

   Cela évite précisément l’effet
   "petits points alignés/réguliers".
*/

const dust = document.getElementById("goldDust");

const numberOfParticles = 115;

for (let i = 0; i < numberOfParticles; i++) {

    const particle = document.createElement("span");

    const size =
        Math.random() * 2.2 + 0.6;

    const x =
        Math.random() * 100;

    const y =
        Math.random() * 100;

    const opacity =
        Math.random() * 0.50 + 0.18;

    const blur =
        Math.random() * 0.8;

    const duration =
        Math.random() * 4 + 3;

    particle.style.setProperty(
        "--size",
        size + "px"
    );

    particle.style.setProperty(
        "--x",
        x + "%"
    );

    particle.style.setProperty(
        "--y",
        y + "%"
    );

    particle.style.setProperty(
        "--opacity",
        opacity
    );

    particle.style.setProperty(
        "--blur",
        blur + "px"
    );

    particle.style.setProperty(
        "--duration",
        duration + "s"
    );

    dust.appendChild(particle);
}

</script>


</body>
</html>
