<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Saudade & Moi</title>

<style>

/* =========================================
   RÉGLAGES GÉNÉRAUX
   ========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080509;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* =========================================
   VERSION ORDINATEUR
   ========================================= */

.scene {
    position: relative;

    aspect-ratio: 3 / 2;

    width: min(92vw, 1320px);

    max-height: 88vh;
    max-height: 88svh;

    z-index: 1;
}

.decor {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
}


/* =========================================
   ORDINATEUR UNIQUEMENT
   ========================================= */

@media (min-width: 651px) {

    body {
        position: relative;

        background: #050306;
    }


    /*
       Fond noir-violet profond
       autour de l’image
    */

    body::before {
        content: "";

        position: fixed;
        inset: -50px;

        background-image:
            radial-gradient(
                circle at 78% 22%,
                rgba(48, 24, 61, 0.45) 0%,
                rgba(20, 10, 27, 0.25) 38%,
                transparent 68%
            ),
            radial-gradient(
                circle at 18% 82%,
                rgba(68, 40, 22, 0.20) 0%,
                rgba(25, 13, 29, 0.22) 38%,
                transparent 68%
            ),
            linear-gradient(
                160deg,
                #050306 0%,
                #100817 45%,
                #08040c 72%,
                #030204 100%
            ),
            url("./saudade-sans-spotify.png");

        background-size:
            cover,
            cover,
            cover,
            100% 100%;

        background-position: center;
        background-repeat: no-repeat;

        filter: blur(24px);

        transform: scale(1.1);

        opacity: 1;

        z-index: 0;
    }


    /*
       Taille ordinateur conservée
    */

    .scene {
        width: min(
            92vw,
            1320px,
            calc(88svh * 1.5)
        );
    }


    /*
       Fondu très léger sur ordinateur
    */

    .decor {
        -webkit-mask-image: linear-gradient(
            to bottom,
            transparent 0%,
            black 5%,
            black 95%,
            transparent 100%
        );

        mask-image: linear-gradient(
            to bottom,
            transparent 0%,
            black 5%,
            black 95%,
            transparent 100%
        );
    }

}


/* =========================================
   SPOTIFY SUR ORDINATEUR
   ========================================= */

.spotify {
    position: absolute;

    left: 25.85%;
    width: 48.37%;

    top: 55.27%;
    height: 14.84%;

    min-height: 0;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.35);
}

.spotify iframe {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    border-radius: inherit;
}


/* =========================================
   VERSION TÉLÉPHONE UNIQUEMENT
   ========================================= */

@media (max-width: 650px) {

    html,
    body {
        width: 100%;
        height: 100%;

        min-height: 100vh;
        min-height: 100svh;
    }

    body {
        position: relative;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 0;

        overflow: hidden;

        background: #050306;
    }


    /*
       Fond noir et violet profond
    */

    body::before {
        content: "";

        position: fixed;
        inset: -40px;

        background-image:
            radial-gradient(
                circle at 78% 22%,
                rgba(48, 24, 61, 0.55) 0%,
                rgba(20, 10, 27, 0.35) 38%,
                transparent 68%
            ),
            radial-gradient(
                circle at 18% 82%,
                rgba(68, 40, 22, 0.28) 0%,
                rgba(25, 13, 29, 0.30) 38%,
                transparent 68%
            ),
            linear-gradient(
                160deg,
                #050306 0%,
                #100817 45%,
                #08040c 72%,
                #030204 100%
            ),
            url("./saudade-sans-spotify.png");

        background-size:
            cover,
            cover,
            cover,
            100% 100%;

        background-position: center;
        background-repeat: no-repeat;

        filter: blur(18px);

        transform: scale(1.12);

        opacity: 1;

        z-index: 0;
    }


    /*
       Image principale
    */

    .scene {
        position: relative;

        flex: 0 0 auto;

        width: 158vw;

        max-width: none;
        max-height: none;

        aspect-ratio: 3 / 2;

        z-index: 1;
    }


    /*
       Fondu téléphone
    */

    .decor {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        display: block;

        object-fit: contain;

        -webkit-mask-image: linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0, 0, 0, 0.45) 5%,
            black 13%,
            black 87%,
            rgba(0, 0, 0, 0.45) 95%,
            transparent 100%
        );

        mask-image: linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0, 0, 0, 0.45) 5%,
            black 13%,
            black 87%,
            rgba(0, 0, 0, 0.45) 95%,
            transparent 100%
        );
    }


    /*
       Lecteur Spotify sur téléphone
    */

    .spotify {
        position: absolute;

        left: 50%;
        transform: translateX(-50%);

        top: 55.27%;

        width: 76.42vw;
        height: 80px;

        min-height: 80px;

        overflow: hidden;

        border-radius: 12px;

        background: #121212;

        box-shadow:
            0 7px 20px rgba(0, 0, 0, 0.42);
    }

    .spotify iframe {
        display: block;

        width: 100%;
        height: 80px;

        border: 0;

        border-radius: inherit;
    }

}


/* =========================================
   TRÈS PETITS TÉLÉPHONES
   ========================================= */

@media (max-width: 380px) {

    .scene {
        width: 158vw;
    }

    .spotify {
        left: 50%;
        transform: translateX(-50%);

        top: 55.27%;

        width: 78vw;
        height: 80px;

        min-height: 80px;
    }

    .spotify iframe {
        height: 80px;
    }

}

</style>

</head>


<body>

<div class="scene">

    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt=""
    >


    <div class="spotify">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"
            allow="autoplay;
                   clipboard-write;
                   encrypted-media;
                   fullscreen;
                   picture-in-picture"
            loading="lazy"
            title="Flamme - Radio Edit - Slaï">
        </iframe>

    </div>

</div>

</body>

</html>
