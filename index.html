<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<style>

/* ---------- PAGE ---------- */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 15px;

    overflow-x: hidden;

    font-family: Georgia, serif;
    text-align: center;
    color: white;

    /* LE FOND QUE TU AVAIS CHOISI */
    background:
        radial-gradient(circle at 15% 20%,
            rgba(104, 35, 120, 0.30),
            transparent 35%),

        radial-gradient(circle at 85% 75%,
            rgba(129, 46, 116, 0.22),
            transparent 38%),

        radial-gradient(circle at 50% 50%,
            rgba(59, 27, 78, 0.18),
            transparent 55%),

        linear-gradient(
            135deg,
            #08050d 0%,
            #14091d 45%,
            #09050e 100%
        );
}


/* ---------- RECTANGLE CENTRAL ---------- */

.carte {
    width: 90%;
    max-width: 480px;

    padding: 28px 35px;

    border: 1px solid rgba(210, 170, 110, 0.45);
    border-radius: 22px;

    background: rgba(13, 8, 18, 0.42);

    box-shadow:
        0 0 30px rgba(113, 48, 137, 0.18),
        inset 0 0 25px rgba(255,255,255,0.015);
}


/* ---------- TITRE ---------- */

h1 {
    margin: 0 0 18px 0;

    font-size: 29px;
    font-weight: normal;

    color: #f2d9a6;

    text-shadow:
        0 0 10px rgba(220, 170, 100, 0.30);
}


/* ---------- TEXTE ---------- */

.texte {
    margin: 0;

    font-size: 16px;
    line-height: 1.8;

    color: rgba(255,255,255,0.92);
}


/* ---------- TÉLÉPHONE ---------- */

@media (max-width: 600px) {

    .carte {
        width: 88%;
        max-width: 380px;

        padding: 24px 25px;

        border-radius: 20px;
    }

    h1 {
        font-size: 25px;
        margin-bottom: 15px;
    }

    .texte {
        font-size: 15px;
        line-height: 1.7;
    }
}

</style>
</head>


<body>

<div class="carte">

    <h1>Saudade &amp; Moi ♡</h1>

    <p class="texte">
        Un peu de moi, un peu de nous...<br>
        des souvenirs, des émotions,<br>
        et ces petits morceaux de vie<br>
        qu'on garde précieusement.
    </p>

</div>

</body>

</html>
