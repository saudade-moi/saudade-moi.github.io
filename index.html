<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080509;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* =========================================
   ORDINATEUR — INCHANGÉ
   ========================================= */

.scene {
    position: relative;

    aspect-ratio: 3 / 2;

    width: min(92vw, 1320px);

    max-height: 88vh;
    max-height: 88svh;
}

@media (min-width: 651px) {

    .scene {
        width: min(
            92vw,
            1320px,
            calc(88svh * 1.5)
        );
    }

}

.decor {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
}


/* =========================================
   SPOTIFY ORDINATEUR — INCHANGÉ
   ========================================= */

.spotify {
    position: absolute;

    left: 25.85%;
    width: 48.37%;

    top: 55.27%;
    height: 14.84%;

    min-height: 0;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 24px rgba(0,0,0,0.35);
}

.spotify iframe {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    border-radius: inherit;
}


/* =========================================
   TÉLÉPHONE UNIQUEMENT
   ========================================= */

@media (max-width: 650px) {

    body {
        background: #080509;
        overflow: hidden;
    }


    /* Le décor reste agrandi comme actuellement */

    .scene {
        flex: 0 0 auto;

        width: 158vw;

        max-width: none;
        max-height: none;

        aspect-ratio: 3 / 2;
    }


    /*
       SPOTIFY

       Sa largeur dépend maintenant de
       L'ÉCRAN DU TÉLÉPHONE et non plus
       de la grande image.
    */

    .spotify {

        width: 76vw;

        left: 50%;
        transform: translateX(-50%);

        top: 56%;

        height: 13.5vw;

        min-height: 0;

        border-radius: 10px;

        overflow: hidden;

        background: #121212;
    }


    .spotify iframe {

        display: block;

        width: 100%;
        height: 100%;

        border: 0;

        border-radius: inherit;
    }

}


/* =========================================
   PETITS TÉLÉPHONES
   ========================================= */

@media (max-width: 380px) {

    .scene {
        width: 164vw;
    }

    .spotify {
        width: 76vw;

        left: 50%;
        transform: translateX(-50%);

        height: 13.5vw;
    }

}

</style>
</head>


<body>

<div class="scene">

    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt="">


    <div class="spotify">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay;
                   clipboard-write;
                   encrypted-media;
                   fullscreen;
                   picture-in-picture"

            loading="lazy"

            title="Flamme - Radio Edit - Slaï">

        </iframe>

    </div>

</div>

</body>

</html>
