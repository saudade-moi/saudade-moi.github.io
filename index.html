<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    margin: 0;
    padding: 55px 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Georgia, "Times New Roman", serif;
    text-align: center;
    color: white;

    background-color: #050305;

    background-image:
        url("ChatGPT%20Image%2021%20sept.%202026%2C%2014_09_20.png");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}


/* ===== CARTE ===== */

.card {
    width: min(400px, 60vw);

    padding: 30px 30px 25px;

    border-radius: 35px;

    border: 2px solid #e7b34e;

    background:
        linear-gradient(
            145deg,
            rgba(5, 3, 4, 0.94),
            rgba(19, 8, 17, 0.92),
            rgba(5, 3, 4, 0.95)
        );

    box-shadow:
        0 0 8px rgba(255, 190, 70, 0.95),
        0 0 22px rgba(255, 166, 47, 0.60),
        0 0 55px rgba(255, 149, 35, 0.25),
        inset 0 0 30px rgba(255, 172, 57, 0.10);
}


/* ===== TITRE ===== */

h1 {
    margin: 0;

    font-size: clamp(50px, 7vw, 82px);

    line-height: 1.05;

    font-weight: 400;

    color: #f0bd55;

    text-shadow:
        0 0 8px rgba(255, 187, 65, 0.30);
}


/* ===== CŒUR ===== */

.ornament {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 20px;

    margin: 25px auto 25px;
}

.line {
    width: 190px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #efbd54
        );
}

.line.right {
    background:
        linear-gradient(
            90deg,
            #efbd54,
            transparent
        );
}

.heart {
    font-size: 48px;
    line-height: 1;

    color: #f0c65c;
}


/* ===== TEXTES ===== */

.subtitle {
    margin: 0 0 10px;

    font-size: clamp(25px, 3vw, 35px);

    font-style: italic;

    color: #e6c9e5;
}

.description {
    margin: 0 0 32px;

    font-size: clamp(25px, 3vw, 35px);

    font-style: italic;

    color: #ead6e8;
}


/* ===== SPOTIFY ===== */

.spotify-container {
    width: 100%;

    overflow: hidden;

    border-radius: 20px;

    border: 1px solid rgba(229, 174, 67, 0.85);

    background: #000;
}

.spotify-container iframe {
    display: block;

    width: 100%;
    height: 232px;

    border: 0;
}


/* ===== TÉLÉPHONE ===== */

@media (max-width: 600px) {

    body {
        min-height: 100vh;

        padding: 45px 16px;

        align-items: flex-start;

        background-position: center center;
    }

    .card {
        width: 100%;

        padding: 48px 24px 35px;

        border-radius: 30px;
    }

    h1 {
        font-size: 45px;
    }

    .ornament {
        margin: 25px auto 30px;
        gap: 13px;
    }

    .line {
        width: 75px;
    }

    .heart {
        font-size: 42px;
    }

    .subtitle {
        font-size: 24px;

        margin-bottom: 20px;
    }

    .description {
        font-size: 24px;

        line-height: 1.4;

        margin-bottom: 35px;
    }

    .spotify-container iframe {
        height: 270px;
    }
}

</style>
</head>


<body>

<main class="card">

    <h1>Saudade &amp; Moi</h1>

    <div class="ornament">
        <span class="line"></span>
        <span class="heart">♡</span>
        <span class="line right"></span>
    </div>

    <p class="subtitle">
        Un peu de moi, un peu de nous...
    </p>

    <p class="description">
        Où chaque souvenir se prolonge en musique
    </p>

    <div class="spotify-container">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>

    </div>

</main>

</body>
</html>
