<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<style>

/* ---------- PAGE ---------- */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px 20px;

    overflow-x: hidden;

    font-family: Georgia, serif;
    text-align: center;
    color: white;

    /* TON FOND */
    background:
        radial-gradient(circle at 15% 20%,
            rgba(104, 35, 120, 0.30),
            transparent 35%),

        radial-gradient(circle at 85% 75%,
            rgba(129, 46, 116, 0.22),
            transparent 38%),

        radial-gradient(circle at 50% 50%,
            rgba(59, 27, 78, 0.18),
            transparent 55%),

        linear-gradient(
            135deg,
            #08050d 0%,
            #14091d 45%,
            #09050e 100%
        );
}


/* ---------- RECTANGLE ---------- */

.carte {
    width: 600px;
    max-width: 85vw;

    padding: 22px 30px;

    border: 1px solid rgba(214, 174, 110, 0.55);
    border-radius: 18px;

    background: rgba(12, 7, 17, 0.40);

    box-shadow:
        0 0 25px rgba(113, 48, 137, 0.18),
        inset 0 0 20px rgba(255,255,255,0.02);
}


/* ---------- TITRE ---------- */

h1 {
    margin: 0 0 14px 0;

    font-size: 27px;
    font-weight: normal;

    color: #e8c98f;

    text-shadow:
        0 0 10px rgba(226, 176, 103, 0.35);
}


/* ---------- TEXTE ---------- */

.texte {
    margin: 0;

    font-size: 15px;
    line-height: 1.65;

    color: rgba(255,255,255,0.90);
}


/* ---------- TÉLÉPHONE ---------- */

@media (max-width: 600px) {

    .carte {
        width: 340px;
        max-width: 88vw;

        padding: 20px 22px;
    }

    h1 {
        font-size: 24px;
    }

    .texte {
        font-size: 14px;
    }
}

</style>
</head>

<body>

<div class="carte">

    <h1>Saudade &amp; Moi ♡</h1>

    <p class="texte">
        Un peu de moi, un peu de nous...<br>
        des souvenirs, des émotions,<br>
        et ces petits morceaux de vie<br>
        qu'on garde précieusement.
    </p>

</div>

</body>

</html>
