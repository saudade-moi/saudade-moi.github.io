<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<!-- POLICES -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Italiana&family=Parisienne&display=swap" rel="stylesheet">

<style>

/* =========================================================
   PAGE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px 15px;

    overflow-x: hidden;

    text-align: center;
    color: white;

    background:
        url("./fond.png")
        center center / cover
        no-repeat fixed;

    background-color: #050205;
}


/* =========================================================
   CADRE PRINCIPAL
   ========================================================= */

.card {
    position: relative;

    width: 620px;
    max-width: 90vw;

    padding: 27px 34px 25px;

    border-radius: 20px;

    background:
        radial-gradient(
            ellipse at 50% 40%,
            rgba(34, 18, 11, 0.20) 0%,
            rgba(8, 3, 6, 0.88) 72%
        );

    border: 1px solid rgba(255, 205, 105, 1);

    box-shadow:
        0 0 2px rgba(255, 255, 220, 1),
        0 0 7px rgba(255, 214, 112, 0.95),
        0 0 16px rgba(255, 166, 40, 0.75),
        0 0 32px rgba(255, 123, 15, 0.35),
        inset 0 0 12px rgba(255, 187, 61, 0.12),
        0 12px 35px rgba(0, 0, 0, 0.65);
}


/* PETIT ÉCLAT EN HAUT */

.card::before {
    content: "";

    position: absolute;

    top: -2px;
    left: 50%;

    transform: translateX(-50%);

    width: 48px;
    height: 2px;

    border-radius: 50%;

    background: #fff1ba;

    box-shadow:
        0 0 6px #fff4c7,
        0 0 12px #ffc755,
        0 0 20px #ff9c20;
}


/* PETIT ÉCLAT EN BAS */

.card::after {
    content: "";

    position: absolute;

    bottom: -2px;
    left: 50%;

    transform: translateX(-50%);

    width: 43px;
    height: 2px;

    border-radius: 50%;

    background: #ffe9a1;

    box-shadow:
        0 0 6px #fff1b5,
        0 0 12px #ffbd45,
        0 0 20px #ff921b;
}


/* =========================================================
   TITRE
   ========================================================= */

.title {
    margin: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    white-space: nowrap;

    line-height: 0.92;
}


/* SAUDADE + MOI */

.title-word {
    font-family: "Italiana", Georgia, serif;

    font-size: 49px;
    font-weight: 400;

    letter-spacing: -1.5px;

    background:
        linear-gradient(
            90deg,
            #e69a32 0%,
            #ffc35b 24%,
            #fff3b5 50%,
            #ffd776 74%,
            #e69a32 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    color: transparent;

    filter:
        drop-shadow(0 0 3px rgba(255, 185, 60, 0.12));
}


/* & CALLIGRAPHIÉ */

.ampersand {
    display: inline-block;

    margin: -5px 8px 0 7px;

    font-family: "Parisienne", cursive;

    font-size: 68px;
    font-weight: 400;

    line-height: 0.75;

    background:
        linear-gradient(
            180deg,
            #fffbe2 0%,
            #fff2b0 42%,
            #efb446 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    color: transparent;

    transform: translateY(5px);
}


/* =========================================================
   TRAITS + COEUR
   ========================================================= */

.ornament {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 12px;

    margin: 15px auto 11px;
}


.line {
    width: 105px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            #d99a31,
            #fff1a3,
            #d99a31
        );

    box-shadow:
        0 0 4px rgba(255, 185, 54, 0.20);
}


/* COEUR */

.heart {
    position: relative;

    width: 35px;
    height: 27px;

    transform: rotate(-45deg);

    border-left: 2px solid #f5d86e;
    border-bottom: 2px solid #f5d86e;

    border-radius: 2px 0 3px 0;
}


.heart::before,
.heart::after {
    content: "";

    position: absolute;

    border: 2px solid #f5d86e;

    border-radius: 50%;
}


.heart::before {
    width: 18px;
    height: 24px;

    left: -2px;
    top: -13px;

    border-bottom-color: transparent;
}


.heart::after {
    width: 24px;
    height: 18px;

    left: 8px;
    top: 6px;

    border-left-color: transparent;
}


/* =========================================================
   TEXTES
   ========================================================= */

.subtitle {
    margin: 0 0 4px;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 21px;

    font-style: italic;
    font-weight: 400;

    line-height: 1.15;

    color: #edcfeb;

    text-shadow:
        0 1px 4px rgba(0, 0, 0, 0.8);
}


.description {
    margin: 0;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 20px;

    font-style: italic;
    font-weight: 400;

    line-height: 1.15;

    color: #f0d9ee;

    text-shadow:
        0 1px 4px rgba(0, 0, 0, 0.8);
}


/* =========================================================
   SPOTIFY
   ========================================================= */

.music-player {
    width: 100%;

    margin: 17px auto 0;
}


.music-player iframe {
    display: block;

    width: 100%;
    height: 80px;

    border: 0;

    border-radius: 11px;

    box-shadow:
        0 7px 20px rgba(0, 0, 0, 0.48);
}


/* =========================================================
   TABLETTES / PETITS ÉCRANS
   ========================================================= */

@media (max-width: 700px) {

    body {
        background-attachment: scroll;
    }

    .card {
        width: 92vw;
        max-width: 560px;

        padding: 25px 25px 23px;
    }

    .title-word {
        font-size: 44px;
    }

    .ampersand {
        font-size: 62px;
    }

    .line {
        width: 90px;
    }
}


/* =========================================================
   TÉLÉPHONE
   ========================================================= */

@media (max-width: 480px) {

    body {
        padding: 15px 10px;

        background-position: center center;
    }


    .card {
        width: 92vw;
        max-width: 390px;

        padding: 24px 17px 20px;

        border-radius: 18px;
    }


    .title-word {
        font-size: 36px;

        letter-spacing: -1px;
    }


    .ampersand {
        margin: -3px 5px 0;

        font-size: 52px;

        transform: translateY(4px);
    }


    .ornament {
        gap: 10px;

        margin: 15px auto 11px;
    }


    .line {
        width: 68px;
    }


    .heart {
        transform:
            rotate(-45deg)
            scale(0.80);

        margin: -3px -3px;
    }


    .subtitle {
        font-size: 18px;

        margin-bottom: 4px;
    }


    .description {
        font-size: 17px;

        line-height: 1.18;
    }


    .music-player {
        margin-top: 15px;
    }


    .music-player iframe {
        height: 80px;

        border-radius: 11px;
    }
}


/* =========================================================
   TRÈS PETITS TÉLÉPHONES
   ========================================================= */

@media (max-width: 360px) {

    .card {
        width: 94vw;

        padding-left: 13px;
        padding-right: 13px;
    }


    .title-word {
        font-size: 32px;
    }


    .ampersand {
        font-size: 47px;
    }


    .line {
        width: 55px;
    }


    .subtitle {
        font-size: 17px;
    }


    .description {
        font-size: 16px;
    }
}

</style>

</head>


<body>

<div class="card">


    <!-- TITRE -->

    <h1 class="title">

        <span class="title-word">
            Saudade
        </span>

        <span class="ampersand">
            &amp;
        </span>

        <span class="title-word">
            Moi
        </span>

    </h1>


    <!-- COEUR + TRAITS -->

    <div class="ornament">

        <span class="line"></span>

        <span class="heart"></span>

        <span class="line"></span>

    </div>


    <!-- TEXTE -->

    <p class="subtitle">
        Un peu de moi, un peu de nous…
    </p>


    <p class="description">
        Où chaque souvenir se prolonge en musique
    </p>


    <!-- LECTEUR SPOTIFY -->

    <div class="music-player">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>

    </div>


</div>

</body>

</html>
