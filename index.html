<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080509;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* ==================================================
   VERSION ORDINATEUR
   CONSERVÉE
   ================================================== */

.scene {

    position: relative;

    aspect-ratio: 3 / 2;

    width: min(92vw, 1320px);

    max-height: 88vh;
    max-height: 88svh;
}


@media (min-width: 651px) {

    .scene {

        width: min(
            92vw,
            1320px,
            calc(88svh * 1.5)
        );

    }

}


/* ==================================================
   IMAGE
   ================================================== */

.decor {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
}


/* ==================================================
   SPOTIFY ORDINATEUR
   CONSERVÉ
   ================================================== */

.spotify {

    position: absolute;

    left: 25.85%;

    width: 48.37%;

    top: 55.27%;

    height: 14.84%;

    min-height: 0;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 24px rgba(0,0,0,0.35);
}


.spotify iframe {

    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    border-radius: inherit;
}


/* ==================================================
   VERSION TÉLÉPHONE UNIQUEMENT
   ================================================== */

@media (max-width: 650px) {

    body {

        position: relative;

        display: block;

        width: 100vw;

        height: 100vh;
        height: 100svh;

        overflow: hidden;

        background: #080509;
    }


    /*
       Sur téléphone on repart des dimensions
       originales exactes de l'image :
       1536 × 1024.

       Toute la scène sera ensuite réduite
       proportionnellement.
    */

    .scene {

        position: fixed;

        left: 50%;
        top: 46%;

        width: 1536px;
        height: 1024px;

        max-width: none;
        max-height: none;

        aspect-ratio: auto;

        transform-origin: center center;

        transform:
            translate(-50%, -50%)
            scale(var(--phone-scale, 0.4));
    }


    .decor {

        position: absolute;

        left: 0;
        top: 0;

        width: 1536px;
        height: 1024px;

        max-width: none;

        object-fit: fill;
    }


    /*
       Position du lecteur dans l'image originale.

       Le lecteur possède maintenant sa vraie
       hauteur de 152 px AVANT réduction.

       Il est ensuite réduit avec toute la scène.
    */

    .spotify {

        position: absolute;

        left: 397px;
        top: 566px;

        width: 743px;
        height: 152px;

        min-height: 152px;

        transform: none;

        overflow: hidden;

        border-radius: 14px;

        background: #121212;

        box-shadow:
            0 8px 24px rgba(0,0,0,0.35);
    }


    .spotify iframe {

        display: block;

        width: 743px;
        height: 152px;

        border: 0;

        border-radius: 14px;

        overflow: hidden;
    }

}

</style>

</head>


<body>


<div class="scene">


    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt=""
    >


    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy"

            title="Flamme - Radio Edit - Slaï">

        </iframe>

    </div>


</div>


<script>

/*
   UNIQUEMENT POUR LE TÉLÉPHONE.

   Le cadre doré de l'image originale mesure
   environ 910 px de large.

   On lui donne environ 92 % de la largeur
   du téléphone.

   L'ordinateur n'est absolument pas concerné.
*/

function reglerTelephone() {

    if (window.innerWidth <= 650) {

        const largeurTelephone = window.innerWidth;

        const largeurCadreOriginal = 910;

        const largeurCadreVoulue =
            largeurTelephone * 0.92;

        const echelle =
            largeurCadreVoulue / largeurCadreOriginal;

        document.documentElement.style.setProperty(
            "--phone-scale",
            echelle
        );

    } else {

        document.documentElement.style.removeProperty(
            "--phone-scale"
        );

    }
}


reglerTelephone();

window.addEventListener(
    "resize",
    reglerTelephone
);

window.addEventListener(
    "orientationchange",
    reglerTelephone
);

</script>


</body>

</html>
