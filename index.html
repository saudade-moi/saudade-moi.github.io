<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Saudade & Moi</title>

<style>

/* ==============================
   BASE
   ============================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #070408;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    overflow: hidden;
}


/* ==============================
   PAGE
   ============================== */

.page {

    position: relative;

    width: 100vw;
    height: 100vh;
    height: 100svh;

    overflow: hidden;

    background-color: #070408;

}


/* ==============================
   IMAGE DU DÉCOR
   ============================== */

.decor {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    /*
       Taille ordinateur :
       on réduit le cadre mais on garde
       les phrases suffisamment grandes.
    */

    width: min(1360px, 92vw);

    height: auto;

    display: block;

}


/* ==============================
   SPOTIFY
   ============================== */

.spotify {

    position: absolute;

    left: 50%;

    /*
       Position calculée par rapport
       à l'image complète.
    */

    top: 64%;

    transform: translate(-50%, -50%);

    width: min(720px, 49vw);

    height: 152px;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.38);

}

.spotify iframe {

    display: block;

    width: 100%;
    height: 152px;

    border: 0;

    border-radius: 14px;

}


/* ==========================================
   ORDINATEUR AVEC ÉCRAN MOINS LARGE
   ========================================== */

@media (max-width: 1100px) and (min-width: 651px) {

    .decor {

        width: 96vw;

    }

    .spotify {

        width: 58vw;

        max-width: 680px;

        top: 64%;

    }

}


/* ==========================================
   TÉLÉPHONE
   ========================================== */

@media (max-width: 650px) {

    body {
        overflow-y: auto;
    }

    .page {

        min-height: 100svh;

        height: 100svh;

        overflow: hidden;

    }


    /*
       Sur téléphone :
       on agrandit suffisamment l'image
       pour que le titre ET les phrases
       restent lisibles.

       Les côtés du décor peuvent être
       légèrement coupés.
    */

    .decor {

        width: auto;

        height: 78svh;

        max-width: none;

    }


    .spotify {

        width: 80vw;

        max-width: 390px;

        height: 152px;

        top: 65%;

        border-radius: 12px;

    }


    .spotify iframe {

        height: 152px;

        border-radius: 12px;

    }

}


/* ==========================================
   PETITS TÉLÉPHONES
   ========================================== */

@media (max-width: 380px) {

    .decor {

        height: 75svh;

    }

    .spotify {

        width: 84vw;

        top: 65%;

    }

}

</style>

</head>


<body>


<main class="page">


    <!-- IMAGE VALIDÉE -->

    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt=""
    >


    <!-- VRAI SPOTIFY : FLAMME / SLAÏ -->

    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy"

            title="Flamme - Radio Edit - Slaï">

        </iframe>

    </div>


</main>


</body>

</html>
