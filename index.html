<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<style>

/* ---------- PAGE ---------- */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 15px;

    font-family: Georgia, serif;
    text-align: center;
    color: white;

    background-image:
        url("fond.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


/* ---------- RECTANGLE ---------- */

.card {
    width: 520px;
    max-width: 88vw;

    margin: 0 auto;

    padding: 28px 32px 25px;

    border-radius: 20px;

    background: rgba(10, 6, 11, 0.88);

    border: 1px solid rgba(236, 188, 84, 0.85);

    box-shadow:
        0 0 8px rgba(255, 198, 83, 0.40),
        0 15px 40px rgba(0, 0, 0, 0.65);
}


/* ---------- TITRE ---------- */

h1 {
    margin: 0 0 18px;

    font-size: 40px;
    font-weight: normal;
    letter-spacing: 3px;

    color: #f0c765;
}


/* ---------- PREMIÈRE PHRASE ---------- */

.subtitle {
    margin: 0 0 10px;

    font-size: 19px;
    font-style: italic;

    color: #e6c5e7;
}


/* ---------- DEUXIÈME PHRASE ---------- */

.card p:not(.subtitle) {
    margin: 0;

    font-size: 17px;
    line-height: 1.4;

    color: #ead8ed;
}


/* ---------- MUSIQUE SPOTIFY ---------- */

.music-player {
    margin-top: 22px;
}

iframe {
    display: block;

    width: 100%;
    height: 152px;

    border: 0;
    border-radius: 12px;
}


/* ---------- TÉLÉPHONE ---------- */

@media (max-width: 600px) {

    body {
        padding: 20px 10px;

        background-position: center;
    }

    .card {
        width: 88vw;
        max-width: 360px;

        padding: 24px 18px 20px;
    }

    h1 {
        font-size: 31px;
        letter-spacing: 2px;
    }

    .subtitle {
        font-size: 17px;
    }

    .card p:not(.subtitle) {
        font-size: 15px;
    }
}

</style>

</head>


<body>

<div class="card">

    <h1>Saudade & Moi</h1>

    <p class="subtitle">
        Un peu de moi, un peu de nous…
    </p>

    <p>
        Où chaque souvenir se prolonge en musique
    </p>

    <div class="music-player">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>

    </div>

</div>

</body>

</html>
