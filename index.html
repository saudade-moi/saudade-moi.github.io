<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

/* PAGE */

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;

    font-family: Georgia, serif;
    text-align: center;
    color: white;

    background:
        radial-gradient(circle at 15% 20%,
            rgba(105, 35, 125, 0.30),
            transparent 32%),

        radial-gradient(circle at 85% 75%,
            rgba(75, 25, 95, 0.28),
            transparent 35%),

        linear-gradient(
            135deg,
            #020102 0%,
            #100712 48%,
            #030203 100%
        );
}


/* HALO VIOLET */

body::before {
    content: "";
    position: fixed;
    inset: -30%;

    background:
        radial-gradient(
            ellipse at center,
            transparent 43%,
            rgba(118, 42, 140, 0.14) 57%,
            transparent 72%
        );

    transform: rotate(-15deg);
    pointer-events: none;
}


/* POUSSIÈRE D'OR FINE */

body::after {
    content: "";
    position: fixed;
    inset: 0;

    pointer-events: none;
    opacity: 0.72;

    background-image:

        radial-gradient(circle,
            rgba(255, 220, 135, 0.95) 0 0.7px,
            transparent 1.1px),

        radial-gradient(circle,
            rgba(226, 170, 62, 0.80) 0 0.55px,
            transparent 1px),

        radial-gradient(circle,
            rgba(255, 238, 185, 0.85) 0 0.45px,
            transparent 0.9px);

    background-size:
        37px 37px,
        59px 59px,
        83px 83px;

    background-position:
        0 0,
        17px 23px,
        39px 11px;

    -webkit-mask-image:
        linear-gradient(
            120deg,
            transparent 4%,
            black 22%,
            transparent 45%,
            black 70%,
            transparent 96%
        );

    mask-image:
        linear-gradient(
            120deg,
            transparent 4%,
            black 22%,
            transparent 45%,
            black 70%,
            transparent 96%
        );
}


/* CARTE */

.card {
    position: relative;
    z-index: 2;

    width: calc(100% - 40px);
    max-width: 700px;

    margin: 40px auto;
    padding: 55px 45px 45px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(12, 7, 13, 0.97),
            rgba(29, 13, 34, 0.92),
            rgba(7, 4, 8, 0.97)
        );

    border: 1px solid rgba(239, 190, 79, 0.90);

    box-shadow:
        0 0 8px rgba(255, 202, 92, 0.45),
        0 0 30px rgba(214, 156, 55, 0.18),
        0 18px 55px rgba(0, 0, 0, 0.80),
        inset 0 0 35px rgba(104, 39, 122, 0.14);
}


/* CONTOUR DORÉ */

.card::before {
    content: "";
    position: absolute;
    inset: -2px;

    border-radius: 26px;
    padding: 1px;

    background:
        linear-gradient(
            115deg,
            transparent,
            #e7ae3d,
            #fff0b1,
            transparent 35%,
            transparent 65%,
            #d89a2f,
            #ffe7a0,
            transparent
        );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite: xor;
    mask-composite: exclude;

    pointer-events: none;
}


/* TITRE */

h1 {
    font-size: 48px;
    margin: 15px 0 18px;
    letter-spacing: 3px;
    font-weight: normal;

    background:
        linear-gradient(
            90deg,
            #c78526,
            #f1c45c,
            #fff0ae,
            #d99c32,
            #ffe295
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    text-shadow:
        0 0 16px rgba(229, 172, 63, 0.16);
}


/* CŒUR + LIGNES DORÉES */

h1::after {
    content: "♡";
    display: block;

    width: 230px;
    margin: 18px auto 26px;

    font-size: 25px;
    line-height: 1;

    color: #e9bd59;

    background:
        linear-gradient(
            90deg,
            #dca43e,
            #f7da88
        )
        left center / 88px 1px no-repeat,

        linear-gradient(
            90deg,
            #f7da88,
            #dca43e
        )
        right center / 88px 1px no-repeat;
}


/* PREMIÈRE PHRASE */

.subtitle {
    margin: 0 0 15px;

    font-size: 22px;
    font-style: italic;

    color: #e5c5e8;
}


/* DEUXIÈME PHRASE */

.card p:not(.subtitle) {
    margin: 0;

    font-size: 20px;
    line-height: 1.6;

    color: #ead9ed;
}


/* LECTEUR SPOTIFY */

.music-player {
    margin-top: 32px;
    padding: 1px;

    border-radius: 13px;

    background:
        linear-gradient(
            120deg,
            rgba(235, 184, 72, 0.90),
            rgba(112, 48, 126, 0.45),
            rgba(235, 184, 72, 0.80)
        );

    box-shadow:
        0 0 18px rgba(224, 169, 63, 0.12);
}

iframe {
    display: block;

    width: 100%;
    height: 152px;

    border: 0;
    border-radius: 12px;
}


/* VERSION TÉLÉPHONE */

@media (max-width: 600px) {

    body {
        align-items: flex-start;
        overflow: auto;
    }

    .card {
        margin: 35px 18px;
        width: calc(100% - 36px);

        padding: 40px 22px 30px;
    }

    h1 {
        font-size: 37px;
        letter-spacing: 2px;
    }

    h1::after {
        width: 190px;

        background-size:
            70px 1px,
            70px 1px;
    }

    .subtitle {
        font-size: 19px;
    }

    .card p:not(.subtitle) {
        font-size: 18px;
    }
}

</style>
</head>


<body>

<div class="card">

    <h1>Saudade & Moi</h1>

    <p class="subtitle">
        Un peu de moi, un peu de nous...
    </p>

    <p>
        Où chaque souvenir se prolonge en musique
    </p>

    <div class="music-player">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>

    </div>

</div>

</body>
</html>
