<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Saudade & Moi</title>

<style>

/* =========================
   REMISE À ZÉRO
   ========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #080509;
}


/* =========================
   PAGE ENTIÈRE
   ========================= */

.page {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;
    height: 100svh;

    overflow: hidden;

    background: #080509;
}


/* =========================
   IMAGE ORDINATEUR
   ========================= */

.decor {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: auto;

    height: 86vh;
    height: 86svh;

    max-width: 92vw;

    object-fit: contain;

    display: block;
}


/* =========================
   SPOTIFY ORDINATEUR
   ========================= */

.spotify {

    position: absolute;

    left: 50%;

    /*
       Placé dans la partie basse
       du cadre doré
    */

    top: 63%;

    transform: translate(-50%, -50%);

    /*
       Taille volontairement plus petite
       que dans les essais précédents
    */

    width: 380px;

    max-width: 32vw;

    /*
       IMPORTANT :
       Spotify reste à sa vraie hauteur.
       PLUS de hauteur en pourcentage.
    */

    height: 152px;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 22px rgba(0,0,0,0.35);
}


.spotify iframe {

    display: block;

    width: 100%;

    height: 152px;

    border: 0;

    overflow: hidden;

    border-radius: 14px;
}


/* =========================
   TÉLÉPHONE
   ========================= */

@media (max-width: 650px) {


    .page {

        background: #080509;

    }


    /*
       L'image reste suffisamment grande
       pour que les deux phrases
       restent lisibles.
    */

    .decor {

        width: 140vw;

        height: auto;

        max-width: none;

        left: 50%;

        top: 45%;

        transform: translate(-50%, -50%);
    }


    /*
       Spotify téléphone :
       plus petit que les essais précédents,
       mais toujours 152 px de haut.
    */

    .spotify {

        left: 50%;

        top: 58%;

        transform: translate(-50%, -50%);

        width: 250px;

        max-width: 66vw;

        height: 152px;

        border-radius: 12px;

    }


    .spotify iframe {

        width: 100%;

        height: 152px;

        border: 0;

        border-radius: 12px;

    }

}


/* =========================
   PETITS TÉLÉPHONES
   ========================= */

@media (max-width: 380px) {

    .decor {

        width: 145vw;

    }


    .spotify {

        width: 225px;

        max-width: 64vw;

        height: 152px;

    }

}

</style>

</head>


<body>


<div class="page">


    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt=""
    >


    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy"

            title="Flamme - Radio Edit - Slaï">

        </iframe>

    </div>


</div>


</body>

</html>
