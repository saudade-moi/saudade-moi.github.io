<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #030104;

    overflow: hidden;
}


/* ==================================================
   MODÈLE QUE TU AS CHOISI
   ================================================== */

.page {

    position: relative;

    /*
       Même image sur ordinateur ET téléphone.
       Aucune modification de couleur.
    */

    width: min(100vw, 150vh);

    aspect-ratio: 3 / 2;

    flex-shrink: 0;

    background-image:
        url("./modele-saudade-gauche.png");

    background-size: 100% 100%;

    background-position: center;

    background-repeat: no-repeat;
}


/* ==================================================
   VRAI SPOTIFY
   ================================================== */

/*
   Le vrai Spotify vient exactement recouvrir
   le faux lecteur représenté dans le modèle.
*/

.spotify {

    position: absolute;

    left: 24.1%;
    top: 59.1%;

    width: 51.8%;
    height: 16.7%;

    z-index: 20;

    overflow: hidden;

    background: #000;

    border-radius: 12px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.50);
}


.spotify iframe {

    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    background: #000;

    border-radius: 12px;
}


/* ==================================================
   TÉLÉPHONE
   ================================================== */

/*
   IMPORTANT :
   on ne crée PAS un autre design pour le téléphone.

   C'est exactement le même modèle.
   Il est simplement réduit pour entrer dans l'écran.
*/

@media (max-width: 650px) {

    body {

        min-height: 100svh;

        background: #030104;

        overflow: hidden;
    }


    .page {

        width: 100vw;

        aspect-ratio: 3 / 2;

        /*
           Pas de filtre.
           Donc exactement le même violet
           que sur ordinateur.
        */

        filter: none;
    }


    .spotify {

        /*
           Même position proportionnelle.
           Donc même composition qu'ordinateur.
        */

        left: 24.1%;
        top: 59.1%;

        width: 51.8%;
        height: 16.7%;

        border-radius: 7px;
    }


    .spotify iframe {

        border-radius: 7px;
    }

}

</style>

</head>


<body>


<div class="page">


    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy">

        </iframe>

    </div>


</div>


</body>

</html>
