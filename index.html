<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080509;
}

body {
    overflow: hidden;
}


/* =========================================
   PAGE
   ========================================= */

.page {

    position: relative;

    width: 100vw;

    height: 100vh;
    height: 100svh;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #241020 0%,
            #120911 52%,
            #080509 100%
        );
}


/* =========================================
   IMAGE
   ON GARDE LA TAILLE ACTUELLE
   ========================================= */

.decor {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: auto;

    height: 88vh;
    height: 88svh;

    max-width: 94vw;

    object-fit: contain;

    display: block;
}


/* =========================================
   SPOTIFY - ORDINATEUR
   ========================================= */

.spotify {

    position: absolute;

    left: 50%;
    top: 64%;

    transform: translate(-50%, -50%);

    /*
       RÉDUIT POUR RESTER
       À L'INTÉRIEUR DU CADRE DORÉ
    */

    width: min(460px, 37vw);

    height: 152px;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35);
}


.spotify iframe {

    display: block;

    width: 100%;
    height: 152px;

    border: 0;

    border-radius: 14px;
}


/* =========================================
   ORDINATEUR PEU HAUT
   ========================================= */

@media (min-width: 651px) and (max-height: 700px) {

    .decor {

        height: 86svh;
    }

    .spotify {

        width: min(450px, 36vw);

        top: 64%;
    }
}


/* =========================================
   TÉLÉPHONE
   ========================================= */

@media (max-width: 650px) {

    .page {

        width: 100vw;
        height: 100svh;

        background:
            radial-gradient(
                ellipse at center,
                #291126 0%,
                #140a13 55%,
                #080509 100%
            );
    }


    /*
       ON CONSERVE LE RÉGLAGE DU DÉCOR
       POUR QUE LES PHRASES RESTENT LISIBLES
    */

    .decor {

        width: 145vw;

        height: auto;

        max-width: none;

        left: 50%;
        top: 45%;

        transform: translate(-50%, -50%);
    }


    /*
       SPOTIFY PLUS ÉTROIT :
       IL RESTE DANS LE CADRE DORÉ
    */

    .spotify {

        left: 50%;

        top: 58%;

        transform: translate(-50%, -50%);

        width: 64vw;

        max-width: 330px;

        height: 152px;

        border-radius: 12px;
    }


    .spotify iframe {

        width: 100%;

        height: 152px;

        border-radius: 12px;
    }
}


/* =========================================
   PETITS TÉLÉPHONES
   ========================================= */

@media (max-width: 380px) {

    .decor {

        width: 150vw;

        top: 45%;
    }

    .spotify {

        width: 66vw;

        max-width: 300px;

        top: 58%;
    }
}

</style>

</head>


<body>

<main class="page">


    <!-- IMAGE VALIDÉE -->

    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt=""
    >


    <!-- VRAI SPOTIFY -->

    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy"

            title="Flamme - Radio Edit - Slaï">

        </iframe>

    </div>


</main>

</body>

</html>
