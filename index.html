<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Saudade & Moi</title>

<style>

/* =========================
   REMISE À ZÉRO
   ========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #080509;
}


/* =========================
   PAGE ENTIÈRE
   ========================= */

.page {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;
    height: 100svh;

    overflow: hidden;

    background: #080509;
}


/* =========================
   IMAGE ORDINATEUR
   ========================= */

.decor {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: auto;

    height: 86vh;
    height: 86svh;

    max-width: 92vw;

    object-fit: contain;

    display: block;
}


/* =========================
   SPOTIFY ORDINATEUR
   ========================= */

.spotify {

    position: absolute;

    left: 50%;

    /*
       Placé dans la partie basse
       du cadre doré
    */

    top: 63%;

    transform: translate(-50%, -50%);

    /*
       Taille volontairement plus petite
       que dans les essais précédents
    */

    width: 380px;

    max-width: 32vw;

    /*
       IMPORTANT :
       Spotify reste à sa vraie hauteur.
       PLUS de hauteur en pourcentage.
    */

    height: 152px;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 22px rgba(0,0,0,0.35);
}


.spotify iframe {

    display: block;

    width: 100%;

    height: 152px;

    border: 0;

    overflow: hidden;

    border-radius: 14px;
}


/* =========================
   TÉLÉPHONE
   ========================= */

@media (max-width: 650px) {

    .page {
        width: 100vw;
        height: 100svh;
        overflow: hidden;
        background: #080509;
    }

    /*
       Le dessin horizontal est agrandi
       et centré sur la partie importante :
       cadre + titre + phrases.
    */

    .decor {
        width: 155vw;
        height: auto;
        max-width: none;

        left: 50%;
        top: 42%;

        transform: translate(-50%, -50%);
    }

    /*
       Spotify reste à sa hauteur officielle.
       Largeur suffisante pour éviter
       l'écrasement du lecteur.
    */

    .spotify {
        left: 50%;
        top: 57%;

        transform: translate(-50%, -50%);

        width: 320px;
        max-width: 84vw;

        height: 152px;

        border-radius: 12px;

        overflow: hidden;

        background: #121212;
    }

    .spotify iframe {
        display: block;

        width: 100%;
        height: 152px;

        border: 0;

        border-radius: 12px;
    }
}


/* PETITS TÉLÉPHONES */

@media (max-width: 380px) {

    .decor {
        width: 160vw;
    }

    .spotify {
        width: 300px;
        max-width: 84vw;
    }
}


/* =========================
   PETITS TÉLÉPHONES
   ========================= */

@media (max-width: 380px) {

    .decor {

        width: 145vw;

    }


    .spotify {

        width: 225px;

        max-width: 64vw;

        height: 152px;

    }

}

</style>

</head>


<body>


<div class="page">


    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt=""
    >


    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy"

            title="Flamme - Radio Edit - Slaï">

        </iframe>

    </div>


</div>


</body>

</html>
