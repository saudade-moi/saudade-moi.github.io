potify suivra exactement l’image quand elle est réduite sur ordinateur ou téléphone.
Voici le nouvel index.html complet. Il remplace tous les précédents.
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080509;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* ==================================================
   CONTENEUR DE RÉFÉRENCE

   Proportions EXACTES de l'image :
   1536 × 1024 = 3 / 2

   L'image ET Spotify sont maintenant liés.
   ================================================== */

.scene {

    position: relative;

    aspect-ratio: 3 / 2;

    width: min(92vw, 1320px);

    max-height: 88vh;
    max-height: 88svh;
}


/*
   Si la hauteur de l'écran devient la limite,
   on calcule automatiquement la largeur
   à partir du rapport 3/2.
*/

@media (min-width: 651px) {

    .scene {

        width: min(
            92vw,
            1320px,
            calc(88svh * 1.5)
        );

    }

}


/* ==================================================
   IMAGE
   ================================================== */

.decor {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
}


/* ==================================================
   SPOTIFY

   Position calculée DIRECTEMENT
   d'après l'image 1536 × 1024.
   ================================================== */

.spotify {

    position: absolute;

    /*
       Image originale :
       x ≈ 397 / 1536
       largeur ≈ 743 / 1536
    */

    left: 25.85%;

    width: 48.37%;


    /*
       y ≈ 566 / 1024
    */

    top: 55.27%;


    /*
       Hauteur réelle Spotify fonctionnel :
       on conserve 152 px à l'échelle
       de l'image de référence.
    */

    height: 14.84%;

    min-height: 0;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 24px rgba(0,0,0,0.35);
}


.spotify iframe {

    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    border-radius: inherit;
}


/* ==================================================
   VERSION TÉLÉPHONE
   ================================================== */

@media (max-width: 650px) {

    body {

        overflow: hidden;

        background: #080509;

    }


    /*
       On garde EXACTEMENT le rapport 3/2.

       On agrandit la scène pour que le titre
       et surtout les deux phrases restent lisibles.

       Seules les extrémités décoratives peuvent
       sortir de l'écran.
    */

    .scene {

        flex: 0 0 auto;

        width: 142vw;

        max-width: none;
        max-height: none;

        aspect-ratio: 3 / 2;

    }


    /*
       Spotify reste attaché à l'image.

       Il se réduit donc exactement
       dans les mêmes proportions que le cadre.
    */

    .spotify {

        left: 25.85%;

        width: 48.37%;

        top: 55.27%;

        height: 14.84%;

        border-radius: 10px;

    }

}


/* ==================================================
   PETITS TÉLÉPHONES
   ================================================== */

@media (max-width: 380px) {

    .scene {

        width: 148vw;

    }

}

</style>

</head>


<body>


<div class="scene">


    <!-- IMAGE DE FOND VALIDÉE -->

    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt=""
    >


    <!-- VRAI SPOTIFY -->

    <div class="spotify">

        <iframe

            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"

            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

            loading="lazy"

            title="Flamme - Radio Edit - Slaï">

        </iframe>

    </div>


</div>


</body>

</html>
