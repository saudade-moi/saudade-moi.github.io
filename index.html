<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saudade & Moi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #050205;

    overflow: hidden;
}


/* =====================================================
   IMAGE DE RÉFÉRENCE SANS SPOTIFY
   ===================================================== */

.page {
    position: relative;

    /*
       L'image originale est au format 1536 x 1024.
       On conserve exactement ses proportions.
    */

    width: min(100vw, 150vh);

    aspect-ratio: 3 / 2;

    background-image: url("./reference-saudade-v2.png");

    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}


/* =====================================================
   VRAI LECTEUR SPOTIFY
   ===================================================== */

.spotify {
    position: absolute;

    /*
       Position du lecteur dans l'espace vide
       de l'image de référence
    */

    left: 25%;
    top: 54%;

    width: 50%;
    height: 17%;

    z-index: 10;
}

.spotify iframe {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    border-radius: 13px;

    box-shadow:
        0 8px 24px
        rgba(0, 0, 0, 0.35);
}


/* =====================================================
   ADAPTATION AUX PETITS ÉCRANS
   ===================================================== */

@media (max-width: 650px) {

    body {
        overflow: auto;
    }

    .page {
        width: 100vw;
        aspect-ratio: 3 / 2;
        flex-shrink: 0;
    }

}

</style>

</head>


<body>


<div class="page">


    <div class="spotify">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
        </iframe>

    </div>


</div>


</body>

</html>
