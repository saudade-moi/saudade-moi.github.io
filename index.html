<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Saudade & Moi</title>

<style>

/* =========================================
   RÉGLAGES GÉNÉRAUX
   ========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080509;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* =========================================
   VERSION ORDINATEUR
   NE PAS MODIFIER
   ========================================= */

.scene {
    position: relative;

    aspect-ratio: 3 / 2;

    width: min(92vw, 1320px);

    max-height: 88vh;
    max-height: 88svh;

    z-index: 1;
}

@media (min-width: 651px) {

    .scene {
        width: min(
            92vw,
            1320px,
            calc(88svh * 1.5)
        );
    }

}

.decor {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
}


/* =========================================
   SPOTIFY SUR ORDINATEUR
   ========================================= */

.spotify {
    position: absolute;

    left: 25.85%;
    width: 48.37%;

    top: 55.27%;
    height: 14.84%;

    min-height: 0;

    overflow: hidden;

    border-radius: 14px;

    background: #121212;

    box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.35);
}

.spotify iframe {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    border-radius: inherit;
}


/* =========================================
   VERSION TÉLÉPHONE UNIQUEMENT
   ========================================= */

@media (max-width: 650px) {

    html,
    body {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100svh;
    }

    body {
        position: relative;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 0;

        overflow: hidden;

        background: #080509;
    }


    /*
       Fond agrandi derrière l'image principale.
       Il remplit tout l'écran et supprime
       les grandes bandes noires.
    */

   
body::before {
    content: "";

    position: fixed;
    inset: -40px;

    background-image:
        radial-gradient(
            circle at 75% 20%,
            rgba(111, 32, 110, 0.75) 0%,
            rgba(57, 15, 65, 0.45) 32%,
            transparent 65%
        ),
        radial-gradient(
            circle at 20% 82%,
            rgba(151, 80, 23, 0.45) 0%,
            rgba(75, 25, 63, 0.40) 35%,
            transparent 68%
        ),
        linear-gradient(
            160deg,
            #35102f 0%,
            #541643 45%,
            #260d2d 100%
        ),
        url("./saudade-sans-spotify.png");

    background-size:
        cover,
        cover,
        cover,
        100% 100%;

    background-position: center;
    background-repeat: no-repeat;

    filter: blur(18px);
    transform: scale(1.12);

    opacity: 1;

    z-index: 0;
}

    /*
       L'image principale conserve ses proportions.
       Elle ne change pas sur ordinateur.
    */

    .scene {
        position: relative;

        flex: 0 0 auto;

        width: 158vw;

        max-width: none;
        max-height: none;

        aspect-ratio: 3 / 2;

        z-index: 1;
    }

    .decor {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        display: block;

        object-fit: contain;
    }


    /*
       Lecteur Spotify téléphone
    */

    .spotify {
        position: absolute;

        left: 50%;
        transform: translateX(-50%);

        top: 55.27%;

        width: 76.42vw;
        height: 80px;

        min-height: 80px;

        overflow: hidden;

        border-radius: 12px;

        background: #121212;

        box-shadow:
            0 7px 20px rgba(0, 0, 0, 0.42);
    }

    .spotify iframe {
        display: block;

        width: 100%;
        height: 80px;

        border: 0;

        border-radius: inherit;
    }

}


/* =========================================
   TRÈS PETITS TÉLÉPHONES
   ========================================= */

@media (max-width: 380px) {

    .scene {
        width: 158vw;
    }

    .spotify {
        left: 50%;
        transform: translateX(-50%);

        top: 55.27%;

        width: 78vw;
        height: 80px;

        min-height: 80px;
    }

    .spotify iframe {
        height: 80px;
    }

}

</style>

</head>


<body>

<div class="scene">

    <img
        class="decor"
        src="./saudade-sans-spotify.png"
        alt=""
    >


    <div class="spotify">

        <iframe
            src="https://open.spotify.com/embed/track/2UtoiQC20KmUEEyW4gg5eo?utm_source=generator&theme=0"
            allow="autoplay;
                   clipboard-write;
                   encrypted-media;
                   fullscreen;
                   picture-in-picture"
            loading="lazy"
            title="Flamme - Radio Edit - Slaï">
        </iframe>

    </div>

</div>

</body>

</html>
